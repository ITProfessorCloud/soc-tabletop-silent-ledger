const ST={
  started:false, phase:0, team:'',
  timerOn:true, paused:false, remaining:0, tick:null,
  elapsed:0,
  answered:{},
  optOrder:{},
  flags:{},
  score:{D:0,C:0,E:0,K:0},
  containedAt:null, notifiedAt:null, recallAt:null,
  facilOpen:false
};
const DIMKEYS=['D','C','E','K'];
const clampPct=(v,m)=>Math.max(0,Math.min(100,Math.round(v/m*100)));

function clockAt(minsFromStart){
  const [h,m]=S.startClock.split(':').map(Number);
  const total=h*60+m+minsFromStart;
  return String(Math.floor(total/60)%24).padStart(2,'0')+':'+String(total%60).padStart(2,'0');
}
function resolve(v){return typeof v==='function'?v(ST.flags):v;}

function renderConsole(){
  const ph=S.phases[ST.phase];
  if(!ph) return;
  $('cPhNo').textContent=String(ph.no).padStart(2,'0');
  $('cEyebrow').textContent=`Phase ${ph.no} of ${S.phases.length} · ${ph.clock}`;
  $('cTitle').textContent=ph.title;
  $('cMeters').innerHTML=DIMKEYS.map(k=>{
    const d=S.dims[k];
    return `<div class="meter ${k.toLowerCase()}"><div class="l"><span>${d.nm.split(' ')[0]}</span><b>${ST.score[k]}</b></div>
      <div class="tr"><i style="width:${clampPct(ST.score[k],d.max)}%"></i></div></div>`;
  }).join('');
  $('cPips').innerHTML=S.phases.map((p,i)=>{
    const a=ST.answered[p.id];
    const cls=i===ST.phase?'on':(a?(a.timedOut?'weak':a.verdict):'');
    const tip=a?`${p.title}: ${a.timedOut?'no decision recorded':a.verdict}`:`${p.title}, ${p.clock}`;
    return `<button class="c-pip ${cls}" data-pip="${i}" title="${esc(tip)}">${p.no}</button>`;
  }).join('');
  $('cPips').querySelectorAll('.c-pip').forEach(b=>b.onclick=()=>gotoPhase(+b.dataset.pip));

  const answeredCount=Object.keys(ST.answered).length;
  $('cCtrls').innerHTML=`
    <button class="cbtn ${ST.facilOpen?'on':''}" id="btnFacil" title="Facilitator notes">${icon.book(14)} Notes <kbd>F</kbd></button>
    <button class="cbtn" id="btnTimer" title="Turn the decision timer on or off">${ST.timerOn?icon.clock(14):icon.pause(14)} ${ST.timerOn?'Timer on':'Timer off'} <kbd>T</kbd></button>
    <button class="cbtn ${resetArmed?'arm':''}" id="btnReset" title="Start the exercise again from the brief">
      ${resetArmed?icon.warn(14):icon.restart(14)} ${resetArmed?'Confirm reset':'Reset'} ${resetArmed?'':'<kbd>R</kbd>'}</button>
    <div class="c-vdiv"></div>
    <button class="cbtn" id="btnBack" title="Previous phase" ${ST.phase===0?'disabled':''}>${icon.chevL(14)}</button>
    <button class="cbtn pri" id="btnNext" title="${ST.phase>=S.phases.length-1?'Finish and open the debrief':'Next phase'}">
      ${ST.phase>=S.phases.length-1?'Debrief':'Next'} ${icon.chevR(14)}</button>`;
  $('btnFacil').onclick=toggleFacil;
  $('btnTimer').onclick=toggleTimer;
  $('btnReset').onclick=armReset;
  $('btnBack').onclick=()=>gotoPhase(ST.phase-1);
  $('btnNext').onclick=advance;
}

let resetArmed=false,resetT=null;
function armReset(){
  if(resetArmed){clearTimeout(resetT);resetArmed=false;restart();return;}
  resetArmed=true;renderConsole();
  toast('Press <b>Confirm reset</b> to discard this run and return to the brief.',4200);
  clearTimeout(resetT);
  resetT=setTimeout(()=>{resetArmed=false;renderConsole();},4200);
}
function renderClock(){
  const c=$('cClock');
  if(!ST.timerOn||!ST.started){
    $('cClockBig').textContent=clockAt(ST.elapsed);
    $('cClockSub').textContent='Scenario clock';
    c.className='c-clock';return;
  }
  const m=Math.floor(ST.remaining/60),s=ST.remaining%60;
  $('cClockBig').textContent=`${m}:${String(s).padStart(2,'0')}`;
  $('cClockSub').textContent='Decision time';
  c.className='c-clock'+(ST.remaining<=10?' over':(ST.remaining<=30?' warn':''));
}

function startTimer(sec){
  stopTimer();
  if(!ST.timerOn){renderClock();return;}
  ST.remaining=sec;renderClock();
  ST.tick=setInterval(()=>{
    if(ST.paused) return;
    ST.remaining--;
    const bar=document.querySelector('.dcount i');
    if(bar){const ph=S.phases[ST.phase];bar.style.width=(ST.remaining/ph.decision.timer*100)+'%';
      bar.parentElement.classList.toggle('warn',ST.remaining<=20);}
    renderClock();
    if(ST.remaining<=0){stopTimer();timeOut();}
  },1000);
}
function stopTimer(){if(ST.tick){clearInterval(ST.tick);ST.tick=null;}}
function toggleTimer(){
  ST.timerOn=!ST.timerOn;
  if(!ST.timerOn){stopTimer();}
  else if(ST.started&&!ST.answered[S.phases[ST.phase].id]){startTimer(S.phases[ST.phase].decision.timer);}
  renderConsole();renderClock();
  toast(ST.timerOn?'Decision timer on. Each decision is timed.':'Decision timer off. Discussion mode, no time pressure.');
}

function gotoPhase(i){
  if(i<0||i>=S.phases.length) return;
  ST.phase=i;stopTimer();renderPhase();
}
function advance(){
  if(ST.phase>=S.phases.length-1){finish();return;}
  gotoPhase(ST.phase+1);
}
function renderPhase(){
  const ph=S.phases[ST.phase];
  topbar('Microsoft Defender');rail(ph.rail||'bolt');
  const view=VIEWS[ph.view]?VIEWS[ph.view]():'<div class="pagepad"><div class="h1">Portal</div></div>';
  const already=ST.answered[ph.id];
  $('stagewrap').innerHTML=injectHtml(ph)+view;
  document.body.classList.add('bladeon');
  $('stagewrap').scrollTop=0;
  renderBlade(ph,already);
  renderConsole();renderFacil();
  if(!already&&ST.timerOn){startTimer(ph.decision.timer);}else{stopTimer();renderClock();}
}
function injectHtml(ph){
  const inj=ph.inject;
  return `<div id="inject">
    <div class="ico">${icon.warn(16)}</div>
    <div style="flex:1;min-width:0">
      <div class="l">${esc(inj.label)}</div>
      <div class="t">${esc(resolve(inj.title))}</div>
      <div class="d">${esc(resolve(inj.body))}</div>
      <div class="src">${esc(inj.src)}</div>
    </div></div>`;
}

function optOrder(ph){
  if(!ST.optOrder[ph.id]){
    const ids=ph.decision.opts.map(o=>o.id);
    for(let i=ids.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [ids[i],ids[j]]=[ids[j],ids[i]];
    }
    ST.optOrder[ph.id]=ids;
  }
  return ST.optOrder[ph.id]
    .map(id=>ph.decision.opts.find(o=>o.id===id))
    .filter(Boolean);
}

function renderBlade(ph,already){
  const old=$('dblade');if(old) old.remove();
  const d=ph.decision;
  const el=document.createElement('div');el.id='dblade';
  const optHtml=optOrder(ph).map((o,i)=>{
    if(already){
      const chosen=already.optId===o.id;
      const cls=o.verdict==='strong'?'rev-strong':(o.verdict==='part'?'rev-part':'rev-weak');
      return `<div class="opt locked ${chosen?'sel':''} ${already.revealed?cls:''}">
        <span class="rd"></span>
        ${already.revealed?`<span class="verd ${o.verdict}">${o.verdict==='strong'?'Strong':(o.verdict==='part'?'Partial':'Weak')}</span>`:''}
        <div class="ot">${chosen?'&#9679; ':''}${esc(o.t)}</div><div class="od">${esc(o.d)}</div>
        ${already.revealed?`<div class="fb"><span class="l">Why</span>${esc(o.fb)}</div>`:''}
      </div>`;
    }
    return `<button class="opt" data-opt="${o.id}">
      <span class="rd"></span>
      <div class="ot">${esc(o.t)}</div><div class="od">${esc(o.d)}</div>
      <div class="cost">${icon.clock(11)} costs ${o.cost} min</div>
    </button>`;
  }).join('');
  el.innerHTML=`
    <div class="dh">
      <div class="l"><span>${icon.target(13)}</span> Decision ${ph.no} of ${S.phases.length} · ${ph.clock}</div>
      <div class="q">${esc(d.q)}</div>
      ${!already&&ST.timerOn?`<div class="dcount"><i style="width:100%"></i></div>`:''}
    </div>
    <div class="db">
      ${already&&already.timedOut?`<div class="fb" style="margin-top:0"><span class="l">No decision was made</span>${esc(d.timeout.fb)}</div>`:''}
      ${optHtml}
    </div>
    <div class="df">
      ${already
        ? `<button class="btn ghost" id="btnReveal">${icon.eye(14)} ${already.revealed?'Hide':'Show'} all outcomes</button>
           <div style="flex:1"></div>
           <button class="btn primary" id="btnAdv">${ST.phase>=S.phases.length-1?'Finish and debrief':'Next phase'} ${icon.chevR(13)}</button>`
        : `<span class="mut2" style="font-size:11.5px">${ST.timerOn?'Commit before the clock runs out.':'No timer. Decide when the room is ready.'}</span>
           <div style="flex:1"></div>
           <button class="btn primary" id="btnCommit" disabled>Commit</button>`}
    </div>`;
  $('frame').appendChild(el);
  if(already){
    $('btnReveal').onclick=()=>{already.revealed=!already.revealed;renderBlade(ph,already);};
    $('btnAdv').onclick=advance;
  }else{
    let sel=null;
    el.querySelectorAll('.opt[data-opt]').forEach(b=>{
      b.onclick=()=>{
        el.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));
        b.classList.add('sel');sel=b.dataset.opt;$('btnCommit').disabled=false;
      };
    });
    $('btnCommit').onclick=()=>{if(sel) commit(sel);};
  }
}

function commit(optId){
  const ph=S.phases[ST.phase],d=ph.decision;
  const o=d.opts.find(x=>x.id===optId);
  stopTimer();
  DIMKEYS.forEach(k=>{if(o.score&&o.score[k]) ST.score[k]+=o.score[k];});
  ST.elapsed+=o.cost;
  if(o.set) Object.assign(ST.flags,o.set);
  if(ph.id==='p4'&&(o.set&&(o.set.revoked||o.set.reset))) ST.containedAt=ST.elapsed;
  if(ph.id==='p7'&&o.set&&o.set.notified) ST.notifiedAt=ST.elapsed;
  if(ph.id==='p9'&&o.set&&o.set.recall) ST.recallAt=ST.elapsed;
  ST.answered[ph.id]={optId:o.id,verdict:o.verdict,score:o.score||{},revealed:true,timedOut:false,cost:o.cost};
  renderPhase();
  const label=o.verdict==='strong'?'Strong call.':(o.verdict==='part'?'Partly there.':'That one costs you.');
  toast(`<b>${label}</b> Scenario clock now ${clockAt(ST.elapsed)}.`);
}
function timeOut(){
  const ph=S.phases[ST.phase],t=ph.decision.timeout;
  DIMKEYS.forEach(k=>{if(t.score&&t.score[k]) ST.score[k]+=t.score[k];});
  ST.elapsed+=t.cost||8;
  if(t.set) Object.assign(ST.flags,t.set);
  ST.answered[ph.id]={optId:null,verdict:'weak',score:t.score||{},revealed:true,timedOut:true,cost:t.cost||8};
  renderPhase();
  toast('<b>Time.</b> No decision was recorded, and the scenario moved without you.');
}

function toggleFacil(){
  ST.facilOpen=!ST.facilOpen;
  $('facil').classList.toggle('show',ST.facilOpen);
  document.body.classList.toggle('facilon',ST.facilOpen);
  renderConsole();
}
function renderFacil(){
  const ph=S.phases[ST.phase];if(!ph) return;
  $('facilName').textContent=`Phase ${ph.no} · ${ph.title}`;
  const f=ph.facil||{say:[],probe:[],watch:[]};
  $('facilBody').innerHTML=`
    <h4>Say this</h4><ul>${f.say.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
    <h4>Questions to put to the room</h4>
    ${f.probe.map(p=>`<div class="ask"><div class="q">${esc(p.q)}</div><div class="a">${esc(p.a)}</div></div>`).join('')}
    <h4 class="alt">Watch for</h4><ul>${(f.watch||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
    <div class="phlist"><h4 class="alt" style="margin-top:0">Jump to phase</h4>
      ${S.phases.map((p,i)=>`<button class="ph ${i===ST.phase?'on':(ST.answered[p.id]?'past':'')}" data-ph="${i}">
        <span class="n">${p.no}</span><span>${esc(p.title)} <span class="mut2">· ${p.clock}</span></span></button>`).join('')}
    </div>`;
  $('facilBody').querySelectorAll('.ph').forEach(b=>b.onclick=()=>gotoPhase(+b.dataset.ph));
}
$('facilClose').innerHTML=icon.x(16);
$('facilClose').onclick=toggleFacil;
$('consoleGrip').onclick=()=>document.body.classList.toggle('consoleon');

    <div style="display:flex;gap:28px;align-items:flex-start;flex-wrap:wrap">
      <div style="flex:1;min-width:300px">
        <h1>Operation <em>Silent Ledger</em></h1>

      </div>
      <div style="flex-shrink:0;padding-top:4px">${profo(168)}</div>

      <div class="gcard"><div class="n">8</div><div class="d" style="margin-top:6px">attack stages, mapped</div></div>
      <div class="gcard"><div class="n">4</div><div class="d" style="margin-top:6px">scored dimensions</div></div>
    </div>

    <h2>The tenant</h2>

      ${S.background.map(p=>`<div class="d" style="margin-bottom:9px">${esc(p)}</div>`).join('')}
    </div>

    <h2>What this exercise tests</h2>
    <div class="g2">
      ${S.objectives.map((o,i)=>`<div class="gcard"><div class="t"><span class="mono" style="color:var(--ip-gold);font-size:13px">${String(i+1).padStart(2,'0')}</span> ${esc(o)}</div></div>`).join('')}
    </div>

    <h2>Before you start</h2>

      <div>
        <div class="d" style="font-size:13px;color:#C6D2E8;line-height:1.6;margin-bottom:14px">

function begin(withTimer){
  ST.team=($('teamName')&&$('teamName').value.trim())||'';
  ST.timerOn=withTimer;ST.started=true;
  $('screen').classList.remove('show');
  document.body.classList.add('consoleon');
  gotoPhase(0);
}

function total(){return DIMKEYS.reduce((a,k)=>a+ST.score[k],0);}
function bandFor(t){return S.bands.find(b=>t>=b.min)||S.bands[S.bands.length-1];}
function ring(pct,val){
  const r=74,c=2*Math.PI*r,off=c*(1-pct/100);
  return `<div class="ring"><svg width="172" height="172" viewBox="0 0 172 172">
    <circle cx="86" cy="86" r="${r}" fill="none" stroke="rgba(255,255,255,.13)" stroke-width="11"/>
    <circle cx="86" cy="86" r="${r}" fill="none" stroke="var(--ip-amber)" stroke-width="11" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${off}"/></svg>
    <div class="mid"><div class="v">${val}</div><div class="o">out of 100</div></div></div>`;
}
function finish(){
  stopTimer();
  const t=total(),b=bandFor(t);
  const contain=ST.containedAt!==null?ST.containedAt:null;
  const notify=ST.notifiedAt!==null?ST.notifiedAt:null;
  $('screen').classList.add('show');
  $('screenBody').innerHTML=`
    <div class="eyebrow">${ipMark(15,true)} <span>After action report · ${S.id} · ${S.codename}</span></div>
    <h1>${ST.team?esc(ST.team):'Exercise'} <em>debrief</em></h1>
    <div class="lede">${esc(b.d)}</div>

    <div style="display:flex;gap:34px;align-items:center;flex-wrap:wrap;margin-bottom:10px">
      ${ring(t,t)}
      <div style="flex:1;min-width:280px">
        <div style="margin-bottom:16px"><span class="band ${b.cls}">${b.nm}</span></div>
        ${DIMKEYS.map(k=>{const d=S.dims[k],v=ST.score[k],p=clampPct(v,d.max);
          return `<div class="dim"><div class="top"><span class="nm">${d.nm}</span><span class="sc2">${v} / ${d.max}</span></div>
          <div class="tr"><i style="width:${p}%;background:${d.c}"></i></div>
          <div class="ds">${esc(p>=70?d.hi:d.lo)}</div></div>`;}).join('')}
      </div>
    </div>

    <h2>The clock</h2>
    <div class="g4">
      <div class="gcard"><div class="n">${clockAt(ST.elapsed)}</div><div class="d" style="margin-top:6px">Scenario clock at close. It began at ${S.startClock}.</div></div>
      <div class="gcard"><div class="n">${contain!==null?contain+'m':'None'}</div><div class="d" style="margin-top:6px">Time to containment from first look. A strong run contains inside 25 minutes.</div></div>
      <div class="gcard"><div class="n">${notify!==null?clockAt(notify):'Not done'}</div><div class="d" style="margin-top:6px">Customer notified. Their seventy two hour clock starts here.</div></div>
      <div class="gcard"><div class="n" style="color:${ST.recallAt!==null?'#8FE494':'#FF9E9B'}">${ST.recallAt!==null?'Yes':'No'}</div><div class="d" style="margin-top:6px">Bank recall requested inside the window where money can still be recovered.</div></div>
    </div>

    <h2>Decision by decision</h2>
    ${S.phases.map(ph=>{
      const a=ST.answered[ph.id];
      const chosen=a&&a.optId?ph.decision.opts.find(o=>o.id===a.optId):null;
      const best=ph.decision.opts.find(o=>o.verdict==='strong');
      const vcls=a?(a.timedOut?'weak':a.verdict):'weak';
      const vlab=a?(a.timedOut?'No decision':(a.verdict==='strong'?'Strong':(a.verdict==='part'?'Partial':'Weak'))):'Not reached';
      return `<div class="rep" data-rep>
        <button class="rh"><span class="rn">${String(ph.no).padStart(2,'0')}</span>
          <span class="rq">${esc(ph.decision.q)}</span>
          <span class="verd ${vcls}" style="margin:0">${vlab}</span>
          <span style="color:#8DA2CC">${icon.chevD(15)}</span></button>
        <div class="rbdy">
          <div class="lab">What you did</div>
          <div class="you">${a?(a.timedOut?esc(ph.decision.timeout.fb):esc(chosen.t)):'This phase was not reached.'}</div>
          ${chosen?`<div style="margin-top:8px">${esc(chosen.fb)}</div>`:''}
          ${chosen&&chosen.verdict!=='strong'?`<div class="lab g">What a strong response does</div>
            <div><b>${esc(best.t)}</b>. ${esc(best.fb)}</div>`:''}
        </div></div>`;
    }).join('')}

    <h2>What actually happened</h2>
    <div class="chain">
      ${S.chain.map(c=>`<div class="st"><div class="dot">${icon[c.ic](17)}</div>
        <div class="tt">${esc(c.t)}</div><div class="td">${esc(c.d)}</div><span class="mi">${c.mi}</span></div>`).join('')}
    </div>

    <h2>Six things worth taking away</h2>
    ${S.lessons.map((l,i)=>`<div class="owlwrap">${i===0?profo(52):`<div style="width:46px;flex-shrink:0;text-align:center;font-family:var(--mono);font-size:19px;font-weight:700;color:var(--ip-gold);padding-top:4px">${String(i+1).padStart(2,'0')}</div>`}
      <div><div class="ot">${esc(l.t)}</div><div class="od">${esc(l.d)}</div></div></div>`).join('')}

    <h2>Detections that would have shortened this</h2>
    <div style="font-size:13px;color:#C6D2E8;line-height:1.62;margin-bottom:14px;max-width:760px">
      Every query below is written for Microsoft Sentinel and can be lifted into an analytic rule. Set the lookback and the firing window deliberately, and bound the seed on ingestion time so a scheduled rule does not raise the same incident twice.
    </div>
    ${S.detections.map(d=>`<div class="dkql"><div class="h">${icon.search(14)} ${esc(d.t)}</div>
      <div style="padding:0 14px 10px;font-size:12.3px;line-height:1.55;color:#9FB1CE">${esc(d.d)}</div>
      <pre>${kqlHi(d.q)}</pre></div>`).join('')}

    <h2>Actions, with owners</h2>
    ${S.actions.map((a,i)=>`<div class="ai sev-${a.sev}"><span class="num">${String(i+1).padStart(2,'0')}</span>
      <div><div class="t">${esc(a.t)}</div><div class="d">${esc(a.d)}</div><div class="own">${esc(a.own)}</div></div></div>`).join('')}

    <h2>Take it with you</h2>
    <div class="noprint" style="display:flex;gap:11px;flex-wrap:wrap;align-items:center">
      <button class="bigbtn" id="btnPrint">${icon.print(15)} Save the report as a PDF</button>
      <button class="bigbtn alt" id="btnJson">${icon.dl(15)} Export this run as JSON</button>
      <button class="bigbtn alt" id="btnReview">${icon.eye(15)} Reopen the portal</button>
      <button class="bigbtn alt" id="btnAgain">${icon.restart(15)} Run it again</button>
    </div>
    <div class="noprint" style="margin-top:12px;font-size:12px;color:#8496C4;line-height:1.6;max-width:640px">
      Printing uses the browser print dialogue, so choose Save as PDF to keep it. The JSON export holds every decision and both clocks, which is how you compare two teams that ran the same scenario.
    </div>
    <div style="margin-top:26px;padding-top:16px;border-top:1px solid rgba(255,255,255,.14);font-size:11.5px;color:#7E93B8;line-height:1.7">
      ${S.codename} · ${S.id} · ${S.tlp} · Training simulation. All names, addresses and telemetry are invented.
      Built by IT Professor · itprofessor.cloud${ST.team?' · Run recorded for '+esc(ST.team):''}
    </div>`;

  $('screenBody').querySelectorAll('[data-rep] .rh').forEach(b=>{
    b.onclick=()=>b.parentElement.classList.toggle('open');});
  $('btnPrint').onclick=()=>window.print();
  $('btnAgain').onclick=()=>{
    const b=$('btnAgain');
    if(b.dataset.armed==='1'){restart();return;}
    b.dataset.armed='1';b.style.background='#C42B1C';b.style.color='#fff';
    b.innerHTML=`${icon.warn(15)} Confirm, this clears the run`;
    setTimeout(()=>{if(!b.isConnected)return;b.dataset.armed='';b.style.background='';b.style.color='';
      b.innerHTML=`${icon.restart(15)} Run it again`;},4200);
  };
  $('btnReview').onclick=()=>{$('screen').classList.remove('show');};
  $('btnJson').onclick=exportJson;
}
function exportJson(){
  const out={
    exercise:S.id,codename:S.codename,team:ST.team||null,
    completedAt:new Date().toISOString(),
    timerUsed:ST.timerOn,
    score:{...ST.score,total:total(),band:bandFor(total()).nm},
    clock:{startedAt:S.startClock,closedAt:clockAt(ST.elapsed),simulatedMinutes:ST.elapsed,
      timeToContainment:ST.containedAt,customerNotifiedAt:ST.notifiedAt!==null?clockAt(ST.notifiedAt):null,
      bankRecallRequested:ST.recallAt!==null},
    decisions:S.phases.map(p=>{const a=ST.answered[p.id];
      return {phase:p.no,title:p.title,question:p.decision.q,
        answer:a?(a.timedOut?'TIMED OUT':p.decision.opts.find(o=>o.id===a.optId).t):null,
        verdict:a?(a.timedOut?'timeout':a.verdict):null,minutesSpent:a?a.cost:null};}),
    flags:ST.flags
  };
  const blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`${S.id}-${(ST.team||'run').replace(/[^a-z0-9]+/gi,'-').toLowerCase()}.json`;
  a.click();URL.revokeObjectURL(a.href);
  toast('Run exported. Collect one file per team and compare them in the hot wash.');
}
function restart(){
  stopTimer();
  resetArmed=false;clearTimeout(resetT);
  ST.started=false;ST.phase=0;ST.elapsed=0;ST.answered={};ST.flags={};
  ST.score={D:0,C:0,E:0,K:0};ST.optOrder={};
  ST.containedAt=null;ST.notifiedAt=null;ST.recallAt=null;
  ST.facilOpen=false;$('facil').classList.remove('show');
  document.body.classList.remove('consoleon','facilon','bladeon');
  const b=$('dblade');if(b) b.remove();
  showBrief();
}

document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return;
  const k=e.key.toLowerCase();
  if(!ST.started){if(k==='enter'){const s=$('btnStart');if(s) s.click();}return;}
  if($('screen').classList.contains('show')){if(k==='r') restart();return;}
  if(k==='f'){e.preventDefault();toggleFacil();}
  else if(k==='t'){e.preventDefault();toggleTimer();}
  else if(k==='p'){e.preventDefault();ST.paused=!ST.paused;toast(ST.paused?'Paused.':'Running.');}
  else if(k==='r'){e.preventDefault();armReset();}
  else if(k==='arrowright'){e.preventDefault();advance();}
  else if(k==='arrowleft'){e.preventDefault();gotoPhase(ST.phase-1);}
  else if(['1','2','3','4'].includes(k)){
    const opts=document.querySelectorAll('#dblade .opt[data-opt]');
    const i=+k-1;if(opts[i]) opts[i].click();
  }
  else if(k==='enter'){const c=$('btnCommit');if(c&&!c.disabled) c.click();
    else{const n=$('btnAdv');if(n) n.click();}}
});

function selfTest(){
  const R=[],ok=(n,c,d='')=>R.push({n,pass:!!c,d});
  ok('T1 phases exist',S.phases.length>0,`${S.phases.length} phases`);
  ok('T2 phase ids unique',new Set(S.phases.map(p=>p.id)).size===S.phases.length);
  ok('T3 every phase has a view that renders',S.phases.every(p=>typeof VIEWS[p.view]==='function'),
     S.phases.filter(p=>typeof VIEWS[p.view]!=='function').map(p=>p.view).join(',')||'all present');
  ok('T4 every phase has a decision with 2 or more options',S.phases.every(p=>p.decision&&p.decision.opts.length>=2));
  ok('T5 option ids unique within each phase',S.phases.every(p=>new Set(p.decision.opts.map(o=>o.id)).size===p.decision.opts.length));
  ok('T6 every option has a verdict',S.phases.every(p=>p.decision.opts.every(o=>['strong','part','weak'].includes(o.verdict))));
  ok('T7 every phase has exactly one strong option',S.phases.every(p=>p.decision.opts.filter(o=>o.verdict==='strong').length===1),
     S.phases.filter(p=>p.decision.opts.filter(o=>o.verdict==='strong').length!==1).map(p=>p.id).join(',')||'all single');
  ok('T8 every option has feedback text',S.phases.every(p=>p.decision.opts.every(o=>o.fb&&o.fb.length>60)));
  ok('T9 every option has a time cost',S.phases.every(p=>p.decision.opts.every(o=>typeof o.cost==='number'&&o.cost>=0)));
  ok('T10 every phase has a timeout branch',S.phases.every(p=>p.decision.timeout&&p.decision.timeout.fb));
  ok('T11 every phase has a timer between 60 and 180 seconds',S.phases.every(p=>p.decision.timer>=60&&p.decision.timer<=180));
  const maxima={D:0,C:0,E:0,K:0};
  S.phases.forEach(p=>DIMKEYS.forEach(k=>{
    maxima[k]+=Math.max(0,...p.decision.opts.map(o=>(o.score&&o.score[k])||0));}));
  DIMKEYS.forEach(k=>ok(`T12 ${k} maximum is exactly ${S.dims[k].max}`,maxima[k]===S.dims[k].max,`reached ${maxima[k]}`));
  ok('T13 total maximum is 100',DIMKEYS.reduce((a,k)=>a+maxima[k],0)===100,
     `total ${DIMKEYS.reduce((a,k)=>a+maxima[k],0)}`);
  ok('T14 every phase has facilitator notes',S.phases.every(p=>p.facil&&p.facil.say.length&&p.facil.probe.length));
  ok('T15 branching flags set somewhere are read somewhere',
     ['disabledOnly','watched','notified'].every(f=>JSON.stringify(S.phases).includes(f)));
  ok('T16 all views render without throwing',(()=>{try{Object.keys(VIEWS).forEach(v=>VIEWS[v]());return true;}catch(e){return false;}})());
  ok('T16b no orphan views defined',Object.keys(VIEWS).every(v=>S.phases.some(p=>p.view===v)),
     Object.keys(VIEWS).filter(v=>!S.phases.some(p=>p.view===v)).join(',')||'all used');
  ok('T16c no invented product surfaces named in copy',
     !/Cloud apps.{0,3}Activity log|Entra ID audit logs and Exchange/i.test(JSON.stringify(S.phases)));
  ok('T17 debrief content present',S.chain.length>=5&&S.detections.length>=3&&S.actions.length>=5&&S.lessons.length>=5);
  ok('T18 every detection carries a query',S.detections.every(d=>d.q&&d.q.includes('|')));
  ok('T19 bands cover zero to one hundred',S.bands[S.bands.length-1].min===0&&S.bands[0].min<=100);
  ok('T20 no British English slips in option titles',
     !/\b(analyze|prioritize|organize|behavior|defense|license to|utilize)\b/i.test(JSON.stringify(S.phases)));
  const banned=/\b(robust|leverage|seamless|comprehensive|actionable|crucial|pivotal|utilize|harness|delve|tapestry|vibrant|realm|elevate|foster|landscape)\b/i;
  ok('T21 no banned vocabulary in scenario copy',!banned.test(JSON.stringify(S).replace(/[A-Za-z]+\.(kql|json)/g,'')));
  ok('T22 no em dashes in copy',!JSON.stringify(S).includes('\u2014'));
  const vtxt=(()=>{try{return Object.keys(VIEWS).map(v=>VIEWS[v]()).join('');}catch(e){return 'RENDER_FAIL';}})();
  const alltxt=JSON.stringify(S)+vtxt;
  ok('T24 ResultType always compared as a string',!/ResultType\s*==\s*0[^"']/.test(alltxt));
  ok('T25 CloudAppEvents identity read from RawEventData.UserId',
     alltxt.includes('RawEventData.UserId')&&!/AccountId\s*=~/.test(alltxt));
  ok('T26 consent query keyed on modifiedProperties displayName',
     alltxt.includes('ConsentAction.Permissions')&&alltxt.includes('DelegatedPermissionGrant.Scope'));
  ok('T27 sign in unions are isfuzzy with per branch normalisation',
     (alltxt.match(/isfuzzy/g)||[]).length>=2&&(alltxt.match(/tostring\(AutonomousSystemNumber\)/g)||[]).length>=3);
  ok('T28 seed bounded on captured ingestion time',alltxt.includes('IngestedAt = ingestion_time()')&&alltxt.includes('IngestedAt >= ago(DetectionWindow)'));
  ok('T29 option order is shuffled and held, and resolves by id',(()=>{
     ST.optOrder={};
     const ph=S.phases[0];
     const first=optOrder(ph).map(o=>o.id).join('');
     const held =optOrder(ph).map(o=>o.id).join('');
     if(first!==held) return false;
     if(optOrder(ph).length!==ph.decision.opts.length) return false;
     let strongFirst=0,runs=200;
     for(let r=0;r<runs;r++){
       ST.optOrder={};
       S.phases.forEach(p2=>{if(optOrder(p2)[0].verdict==='strong') strongFirst++;});
     }
     ST.optOrder={};
     const rate=strongFirst/(runs*S.phases.length);
     return rate>0.15&&rate<0.35;
   })());
  ok('T23 no contractions in scenario copy',
     !/\b(don't|can't|won't|it's|you're|they're|we're|isn't|doesn't|didn't|hasn't|haven't|wasn't|weren't|couldn't|wouldn't|shouldn't)\b/i.test(JSON.stringify(S)));

  const pass=R.filter(r=>r.pass).length;
  const html=`<div style="font-family:var(--mono);font-size:13px;padding:30px;background:#04163C;color:#fff;min-height:100vh">
    <div style="font-size:21px;font-weight:700;margin-bottom:6px">${S.id} self test</div>
    <div style="color:${pass===R.length?'#8FE494':'#FF9E9B'};margin-bottom:20px;font-size:16px">
      ${pass} of ${R.length} passed</div>
    ${R.map(r=>`<div style="padding:6px 0;border-bottom:1px solid rgba(255,255,255,.1);display:flex;gap:12px">
      <span style="color:${r.pass?'#8FE494':'#FF9E9B'};width:52px;flex-shrink:0">${r.pass?'PASS':'FAIL'}</span>
      <span style="flex:1">${esc(r.n)}</span>
      <span style="color:#7E93B8">${esc(r.d)}</span></div>`).join('')}
    <div style="margin-top:24px;color:#7E93B8">Remove ?test=1 from the address to run the exercise.</div></div>`;
  document.body.innerHTML=html;
  document.body.style.overflow='auto';
  return {pass,total:R.length,results:R};
}

window.TTX={SCENARIO:S,state:ST,views:VIEWS,goto:gotoPhase,restart:restart,finish:finish,test:selfTest};

(function boot(){
  const params=new URLSearchParams(location.search);
  if(params.get('test')==='1'){selfTest();return;}
  topbar('Microsoft Defender');rail('bolt');
  $('stagewrap').innerHTML=VIEWS.queue();
  showBrief();
  if(params.get('notimer')==='1') ST.timerOn=false;
})();
</script>
