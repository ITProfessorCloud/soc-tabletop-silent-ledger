<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Microsoft Defender</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{

  --ip-blue:#1F8EE6;
  --ip-blue2:#5AB0F0;
  --ip-sky:#AFD5EF;
  --ip-navy:#31448C;
  --ip-deep:#131B41;
  --ip-deep2:#1E2A63;
  --ip-amber:#F6A01E;
  --ip-gold:#FBD46B;
  --ip-burnt:#DA5C1F;
  --ip-acc:#C24E15;
  --ip-ink:#545355;

  --ms-blue:#0F6CBD; --ms-bg:#FAF9F8; --ms-line:#E1DFDD; --ms-line2:#EDEBE9;
  --ms-txt:#242424; --ms-mut:#616161; --ms-mut2:#8A8886;
  --ms-red:#C50F1F; --ms-org:#F7630C; --ms-yel:#EAA300; --ms-grn:#107C10;
  --console-h:80px;
  --ui:'Segoe UI','Segoe UI Web (West European)',system-ui,-apple-system,sans-serif;
  --con:'Franklin Gothic Medium','Arial Narrow',Arial,var(--ui);
  --mono:'Cascadia Code',Consolas,'Courier New',monospace;
}
html,body{height:100%;font-family:var(--ui);font-size:13px;background:#000;color:var(--ms-txt);overflow:hidden}
button,input,select,textarea{font-family:inherit}
a{color:var(--ms-blue);text-decoration:none;cursor:pointer}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--ip-acc);outline-offset:2px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#C8C6C4;border-radius:5px;border:2px solid var(--ms-bg)}
::-webkit-scrollbar-thumb:hover{background:#A19F9D}

@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fadeonly{from{opacity:0}to{opacity:1}}
@keyframes slidein{from{transform:translateX(38px);opacity:0}to{transform:none;opacity:1}}
@keyframes slideup{from{transform:translateY(26px);opacity:0}to{transform:none;opacity:1}}
@keyframes stagein{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes underline{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes railpop{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes pipglow{0%,100%{box-shadow:0 0 0 0 rgba(246,160,30,.55)}55%{box-shadow:0 0 0 6px rgba(246,160,30,0)}}
@keyframes flash{0%,100%{background:transparent}30%{background:rgba(246,160,30,.15)}}
@keyframes pulsered{0%,100%{box-shadow:0 0 0 0 rgba(197,15,31,0)}50%{box-shadow:0 0 0 7px rgba(197,15,31,.16)}}
@keyframes sweep{0%{transform:translateX(-120%)}100%{transform:translateX(260%)}}
@keyframes ping{0%{transform:scale(.55);opacity:.85}70%{transform:scale(1.28);opacity:0}100%{opacity:0}}
.fade{animation:fadein .34s ease-out both}
.fadeonly{animation:fadeonly .45s ease-out both}
.slidein{animation:slidein .34s ease-out both}
.slideup{animation:slideup .42s cubic-bezier(.2,.9,.3,1) both}
.spin{animation:spin .8s linear infinite;display:inline-block}
.flashrow{animation:flash 1.7s ease-out both}
.shimmer{position:relative;overflow:hidden}
.shimmer::after{content:'';position:absolute;top:0;bottom:0;left:0;width:38%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);animation:sweep 2.6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001s!important;transition-duration:.001s!important}}

#app{height:100vh;display:flex;flex-direction:column;background:var(--ms-bg)}
#topbar{height:48px;background:#000;display:flex;align-items:center;flex-shrink:0;color:#fff;position:relative;z-index:60}
#frame{flex:1;display:flex;min-height:0;position:relative}
#leftrail{width:48px;background:#fff;border-right:1px solid var(--ms-line);display:flex;flex-direction:column;align-items:center;padding-top:6px;gap:2px;flex-shrink:0;overflow:hidden;position:relative;z-index:58}
.railbtn{width:40px;height:40px;border:none;background:transparent;border-radius:4px;display:flex;align-items:center;justify-content:center;color:#424242;cursor:pointer;position:relative;flex-shrink:0}
.railbtn:hover{background:#F3F2F1}
.railbtn.active{color:var(--ms-blue)}
.railbtn.active::before{content:'';position:absolute;left:0;top:10px;bottom:10px;width:3px;background:var(--ms-blue);border-radius:2px;animation:railpop .3s cubic-bezier(.2,.9,.3,1) both}
#content{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--ms-bg);min-width:0}
#stagewrap{flex:1;overflow:auto;position:relative}
#stagewrap > *{animation:stagein .42s cubic-bezier(.2,.9,.3,1) both}
body.consoleon #app{height:calc(100vh - var(--console-h))}

.crumbs{padding:10px 24px 0;font-size:12px;color:var(--ms-mut);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.crumbs .sep{color:#A19F9D}
.crumbs a{color:var(--ms-mut)}
.crumbs .cur{color:var(--ms-txt)}
.pagepad{padding:8px 24px 34px}
.h1{font-size:22px;font-weight:600;color:var(--ms-txt)}
.h2{font-size:15px;font-weight:600;color:var(--ms-txt)}
.h3{font-size:13px;font-weight:600;color:var(--ms-txt)}
.card{background:#fff;border:1px solid var(--ms-line);border-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.cmdbar{display:flex;align-items:center;gap:2px;font-size:13px;flex-wrap:wrap}
.cmd{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:4px;cursor:pointer;border:none;background:transparent;font-size:13px;color:var(--ms-txt);white-space:nowrap}
.cmd:hover:not(.dis){background:#F3F2F1}
.cmd.dis{color:#A19F9D;cursor:default}
.vdiv{width:1px;height:20px;background:var(--ms-line);margin:0 6px}
.searchbox{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ms-mut2);border-radius:4px;padding:4px 10px;color:var(--ms-mut);background:#fff;min-width:180px}
.chip{display:inline-flex;align-items:center;gap:6px;background:#F3F2F1;border:1px solid var(--ms-line);border-radius:14px;padding:3px 8px 3px 12px;font-size:12px;color:#424242;white-space:nowrap}
.btn{border-radius:4px;padding:6px 16px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid transparent;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn.primary{background:var(--ms-blue);color:#fff}
.btn.primary:hover{background:#0C5BA0}
.btn.ghost{background:#fff;color:var(--ms-txt);border-color:var(--ms-mut2)}
.btn.ghost:hover{background:#F3F2F1}
.btn.danger{background:var(--ms-red);color:#fff}
.btn.danger:hover{background:#A80D1A}
.btn:disabled{background:#F3F2F1;color:#A19F9D;border-color:transparent;cursor:default}
.tabrow{display:flex;gap:4px;border-bottom:1px solid var(--ms-line);overflow-x:auto;scrollbar-width:none}
.tabrow::-webkit-scrollbar{height:0}
.tab{padding:8px 12px;font-size:13px;color:#424242;cursor:pointer;position:relative;white-space:nowrap;background:none;border:none}
.tab.active{font-weight:600;color:var(--ms-txt)}
.tab.active::after{content:'';position:absolute;left:10px;right:10px;bottom:-1px;height:2.5px;background:var(--ms-blue);border-radius:2px;transform-origin:left;animation:underline .32s cubic-bezier(.2,.9,.3,1) both}
.mut{color:var(--ms-mut)}
.mut2{color:var(--ms-mut2)}
.mono{font-family:var(--mono)}
.pill{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--ms-line);background:#fff;border-radius:13px;padding:3px 10px;font-size:12px;color:#424242}
.sevsq{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.sevsq .sq{display:inline-flex;gap:1.5px}
.sevsq .sq i{width:6px;height:9px;display:inline-block;background:#D2D0CE}
.sevsq.High .sq i{background:var(--ms-red)}
.sevsq.Medium .sq i:nth-child(-n+2){background:var(--ms-org)}
.sevsq.Low .sq i:nth-child(1){background:var(--ms-yel)}
.sevsq.Informational .sq i:nth-child(1){background:#8A8886}
.stat{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.stat .d{width:8px;height:8px;border-radius:50%;background:#8A8886}
.stat.New .d,.stat.Open .d{background:var(--ms-blue)}
.stat.Active .d,.stat.Resolved .d,.stat.Closed .d{background:var(--ms-grn)}
.stat.InProgress .d{background:var(--ms-org)}
.tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:3px;font-size:11.5px;font-weight:600;white-space:nowrap}
.tag.auto{background:#DEECF9;color:#004578}
.tag.crit{background:#242424;color:#fff}
.tag.mitre{background:#242424;color:#fff;font-weight:400;font-size:11px}
.tag.upd{background:#EFF6FC;color:#0F6CBD;border:1px solid #C7E0F4;font-weight:600}
.tag.acc{background:#FDF0E4;color:var(--ip-acc);border:1px solid #F2D3B8}
.tag.gal{background:#F3F2F1;color:#424242;border:1px solid var(--ms-line);font-weight:400}
.tag.red{background:#FDE7E9;color:#A80D1A;border:1px solid #F3C6CB}
.tag.grn{background:#DFF6DD;color:#0B5A0B;border:1px solid #B7E5B4}
.dt{width:100%;border-collapse:collapse;font-size:12.5px}
.dt th{position:sticky;top:0;background:#fff;text-align:left;padding:9px 12px;font-weight:600;color:#424242;border-bottom:1px solid var(--ms-line);white-space:nowrap;z-index:2}
.dt td{padding:8px 12px;border-bottom:1px solid #F3F2F1;white-space:nowrap;vertical-align:middle}
.dt tbody tr:hover{background:#F5F5F5}
.dt tbody tr.sel{background:#EBF3FC}
.dt tbody tr.clickable{cursor:pointer}
.dt tbody tr.focusrow{background:#FEF7EE;box-shadow:inset 3px 0 0 var(--ip-burnt)}
.scrollx{overflow-x:auto}
.grid{display:grid;gap:12px}
.kv{display:grid;grid-template-columns:168px 1fr;gap:7px 14px;font-size:12.5px}
.kv .k{color:var(--ms-mut)}
.kv .v{color:var(--ms-txt);word-break:break-word}

.kql{background:#fff;border:1px solid var(--ms-line);border-radius:4px;overflow:hidden}
.kql .bar{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--ms-line2);background:#FAF9F8}
.kql pre{margin:0;padding:12px 14px;font-family:var(--mono);font-size:12.5px;line-height:1.65;color:#1F1F1F;white-space:pre-wrap;min-height:40px;overflow-x:auto}
.k-op{color:#0000FF}.k-fn{color:#795E26}.k-str{color:#A31515}.k-num{color:#098658}.k-tab{color:#B03D00;font-weight:600}.k-cmt{color:#008000}

.etag{display:inline-flex;align-items:center;padding:2px 7px;border-radius:2px;font-size:10.5px;font-weight:700;letter-spacing:.3px}
.etag.pim{background:#A4262C;color:#fff}
.etag.ueba{background:#6E6412;color:#fff}
.esec{border-top:1px solid var(--ms-line2);padding:14px 0 4px}
.esec .eh{display:flex;align-items:center;justify-content:space-between;font-size:13.5px;font-weight:600;margin-bottom:14px;cursor:pointer}
.ecol{display:grid;grid-template-columns:1fr 1fr;gap:16px 24px;font-size:12.5px}
.ecol .lbl{font-weight:600;margin-bottom:3px}
.ecol .val{color:#424242;line-height:1.5}
.rcard{padding:0 22px 0 0}
.rcard .rh{border-top:1px solid #C8C6C4;padding-top:9px;font-size:12.5px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:6px}
.sevbar{display:flex;height:9px;border-radius:1px;overflow:hidden;margin-bottom:9px}
.sevleg{display:flex;gap:14px;font-size:11.5px;color:#424242;flex-wrap:wrap}
.sevleg i{width:9px;height:9px;display:inline-block;margin-right:5px;border-radius:1px}

.tm{background:#F5F5F5;border:1px solid var(--ms-line);border-radius:6px;overflow:hidden}
.tm-hd{background:#fff;border-bottom:1px solid var(--ms-line);padding:10px 16px;display:flex;align-items:center;gap:11px}
.tm-body{padding:16px}
.tm-msg{display:flex;gap:11px;margin-bottom:13px}
.tm-av{width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:11.5px;font-weight:700;flex-shrink:0}
.tm-bub{background:#fff;border:1px solid #E6E6E6;border-radius:8px;padding:11px 14px;flex:1;min-width:0}
.tm-nm{font-size:13px;font-weight:700;margin-bottom:3px}
.tm-nm span{font-weight:400;color:var(--ms-mut2);font-size:11.5px;margin-left:7px}
.tm-txt{font-size:12.8px;line-height:1.55;color:#3B3A39}

.ol{border:1px solid var(--ms-line);border-radius:4px;background:#fff;overflow:hidden}
.ol .oh{padding:12px 16px;border-bottom:1px solid var(--ms-line2)}
.ol .subj{font-size:15px;font-weight:600;margin-bottom:7px}
.ol .ob{padding:14px 16px;font-size:13px;line-height:1.6;color:#3B3A39}
.ol .att{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--ms-line);border-radius:4px;padding:7px 11px;font-size:12.5px;margin-top:10px;background:#FAF9F8}

#console{position:fixed;left:0;right:0;bottom:0;height:var(--console-h);z-index:880;
  background:linear-gradient(180deg,var(--ip-deep2) 0%,var(--ip-deep) 100%);
  color:#fff;display:flex;align-items:center;gap:14px;padding:0 14px;
  box-shadow:0 -10px 34px rgba(0,0,0,.42);transform:translateY(0);transition:transform .4s cubic-bezier(.4,0,.2,1)}
body:not(.consoleon) #console{transform:translateY(calc(var(--console-h) - 6px))}
body:not(.consoleon) #console::after{content:'';position:absolute;top:0;left:0;right:0;height:6px;background:linear-gradient(90deg,var(--ip-amber),var(--ip-gold))}
#consoleGrip{position:absolute;top:-22px;left:18px;height:22px;padding:0 12px;border-radius:6px 6px 0 0;border:none;
  background:var(--ip-deep);color:#fff;font-family:var(--con);font-size:10px;letter-spacing:1.2px;text-transform:uppercase;cursor:pointer;
  box-shadow:0 -4px 14px rgba(0,0,0,.3)}
#consoleGrip:hover{background:var(--ip-navy)}
.c-brand{display:flex;align-items:center;gap:11px;flex-shrink:0}
.c-phno{font-family:var(--mono);font-size:25px;font-weight:700;color:var(--ip-amber);line-height:1;letter-spacing:-1px}
.c-eyebrow{font-family:var(--con);font-size:9.5px;letter-spacing:1.4px;text-transform:uppercase;color:#94A6D4;margin-bottom:2px}
.c-title{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.2px;max-width:230px}

.c-pips{display:flex;gap:4px;align-items:center;flex-shrink:0;padding:0 4px}
.c-pip{width:21px;height:21px;border-radius:7px;border:1px solid rgba(255,255,255,.22);background:transparent;
  color:rgba(255,255,255,.55);font-family:var(--mono);font-size:9.5px;font-weight:700;cursor:pointer;padding:0;
  display:inline-flex;align-items:center;justify-content:center;transition:transform .14s,background .14s}
.c-pip:hover{background:rgba(255,255,255,.18);color:#fff;transform:translateY(-1px)}
.c-pip.strong{background:rgba(111,207,127,.34);border-color:rgba(111,207,127,.5);color:#DFF6DD}
.c-pip.part{background:rgba(251,212,107,.3);border-color:rgba(251,212,107,.5);color:#FFF4CE}
.c-pip.weak{background:rgba(218,92,31,.42);border-color:rgba(218,92,31,.62);color:#FFE3D3}
.c-pip.on{background:var(--ip-amber);border-color:var(--ip-amber);color:var(--ip-deep);animation:pipglow 2.4s ease-out infinite}
.c-vdiv{width:1px;height:26px;background:rgba(255,255,255,.16);flex-shrink:0}
.c-meters{display:flex;gap:9px;flex:1;min-width:0;align-items:center}
.meter{flex:1;min-width:0;max-width:150px}
.meter .l{font-family:var(--con);font-size:9px;letter-spacing:1.2px;text-transform:uppercase;color:#94A6D4;display:flex;justify-content:space-between;gap:6px;margin-bottom:4px}
.meter .l b{font-family:var(--mono);color:#fff;font-size:10px}
.meter .tr{height:5px;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden}
.meter .tr i{display:block;height:100%;border-radius:3px;background:var(--ip-amber);transform-origin:left;transition:width .5s cubic-bezier(.2,.9,.3,1)}
.meter.d .tr i{background:var(--ip-blue2)}
.meter.c .tr i{background:#6FCF7F}
.meter.e .tr i{background:var(--ip-gold)}
.meter.k .tr i{background:#F0803A}
.c-clock{flex-shrink:0;text-align:right;font-family:var(--mono);line-height:1.1;min-width:88px}
.c-clock .big{font-size:23px;font-weight:700;letter-spacing:-.5px}
.c-clock .sub{font-size:9.5px;color:#94A6D4;margin-top:3px;white-space:nowrap;font-family:var(--con);letter-spacing:1.1px;text-transform:uppercase}
.c-clock.warn .big{color:#FFB74D}
.c-clock.over .big{color:#FF8080;animation:blink 1s step-end infinite}
.c-ctrls{display:flex;align-items:center;gap:6px;flex-shrink:0}
.cbtn{height:32px;min-width:32px;padding:0 11px;border-radius:6px;border:1px solid rgba(255,255,255,.24);
  background:rgba(255,255,255,.07);color:#fff;font-size:12px;font-weight:600;cursor:pointer;display:inline-flex;
  align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.cbtn:hover:not(:disabled){background:rgba(255,255,255,.17)}
.cbtn.pri{background:var(--ip-amber);border-color:var(--ip-amber);color:var(--ip-deep);box-shadow:0 2px 10px rgba(246,160,30,.3)}
.cbtn.pri:hover{background:var(--ip-gold);border-color:var(--ip-gold);color:var(--ip-deep)}
.cbtn.on{background:var(--ip-amber);border-color:var(--ip-amber);color:var(--ip-deep)}
.cbtn kbd{font-family:var(--mono);font-size:9.5px;opacity:.7;border:1px solid rgba(255,255,255,.3);border-radius:3px;padding:0 3px}
.cbtn:disabled{opacity:.32;cursor:default}

.cbtn.arm{background:#C42B1C;border-color:#C42B1C;color:#fff;animation:pulsered 1.5s ease-in-out infinite}
.cbtn.arm:hover{background:#A81F12;border-color:#A81F12}

#simband{position:fixed;top:0;left:0;right:0;height:3px;z-index:999;pointer-events:none;
  background:repeating-linear-gradient(135deg,var(--ip-amber) 0 12px,var(--ip-navy) 12px 24px)}
#simtag{position:fixed;top:11px;left:50%;transform:translateX(-50%);z-index:998;pointer-events:none;
  font-family:var(--con);font-size:9px;letter-spacing:1.8px;text-transform:uppercase;color:rgba(255,255,255,.42);white-space:nowrap}

#inject{background:#fff;border-bottom:1px solid var(--ms-line);border-left:4px solid transparent;
  border-image:linear-gradient(180deg,var(--ip-navy),var(--ip-amber)) 1;
  box-shadow:0 2px 10px rgba(0,18,58,.07);padding:12px 22px;display:flex;gap:13px;align-items:flex-start;
  position:sticky;top:0;z-index:14;animation:slideup .42s cubic-bezier(.2,.9,.3,1) both}
#inject .ico{width:30px;height:30px;border-radius:8px;background:linear-gradient(150deg,var(--ip-navy),var(--ip-deep));color:#fff;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
#inject .l{font-family:var(--con);font-size:9.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--ip-acc);margin-bottom:3px}
#inject .t{font-size:13.5px;font-weight:700;margin-bottom:4px;color:var(--ip-navy)}
#inject .d{font-size:12.8px;line-height:1.55;color:#3B3A39}
#inject .src{font-size:11px;color:var(--ms-mut2);margin-top:6px;font-family:var(--mono)}

#dblade{position:absolute;right:0;top:0;bottom:0;width:452px;background:#fff;z-index:120;display:flex;flex-direction:column;
  border-left:4px solid transparent;border-image:linear-gradient(180deg,var(--ip-navy),var(--ip-amber)) 1;box-shadow:-16px 0 44px rgba(19,27,65,.22);animation:slidein .36s cubic-bezier(.2,.9,.3,1) both}
#dblade .dh{background:var(--ip-deep);color:#fff;padding:13px 17px;flex-shrink:0}
#dblade .dh .l{font-family:var(--con);font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;color:#94A6D4;display:flex;align-items:center;gap:8px}
#dblade .dh .q{font-size:15.5px;font-weight:700;margin-top:5px;line-height:1.35}
#dblade .db{flex:1;overflow-y:auto;padding:14px 17px 10px}
#dblade .df{border-top:1px solid var(--ms-line2);padding:11px 17px;display:flex;align-items:center;gap:9px;flex-shrink:0;background:#FAF9F8}
.dcount{height:4px;background:rgba(255,255,255,.16);border-radius:2px;overflow:hidden;margin-top:11px}
.dcount i{display:block;height:100%;background:var(--ip-amber);transition:width 1s linear;border-radius:2px}
.dcount.warn i{background:#FF8080}

  transition:transform .34s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column}

                   radial-gradient(820px 460px at 4% 104%,rgba(31,142,230,.22),transparent 62%)}

.tlrow{display:flex;gap:0;margin:8px 0 4px}

.band{display:inline-flex;align-items:center;gap:8px;border-radius:20px;padding:7px 17px;font-size:13px;font-weight:700;

.band.b4{background:rgba(111,207,127,.2);color:#8FE494;border:1px solid rgba(111,207,127,.45)}
.band.b3{background:rgba(90,176,240,.22);color:#9CCDF7;border:1px solid rgba(90,176,240,.5)}
.band.b2{background:rgba(251,212,107,.2);color:var(--ip-gold);border:1px solid rgba(251,212,107,.45)}
.band.b1{background:rgba(218,92,31,.24);color:#F3A472;border:1px solid rgba(218,92,31,.55)}
.dim{margin-bottom:15px}

.dim .nm{font-size:13.4px;font-weight:700}
.dim .sc2{font-family:var(--mono);font-size:13px;color:var(--ip-amber);font-weight:700}
.dim .tr{height:8px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden}
.dim .tr i{display:block;height:100%;border-radius:4px;transform-origin:left;animation:grow .85s cubic-bezier(.2,.9,.3,1) both}
.dim .ds{font-size:11.8px;color:#A2B2D6;margin-top:6px;line-height:1.5}

.rep{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.13);border-radius:10px;margin-bottom:11px;overflow:hidden}

.rep .rn{font-family:var(--mono);font-size:11px;color:#94A6D4;width:22px;flex-shrink:0}
.rep .rq{flex:1;font-size:13.2px;font-weight:600;min-width:0}
.rep .rbdy{padding:0 15px 15px 48px;font-size:12.7px;line-height:1.62;color:#C7D2EC;display:none}
.rep.open .rbdy{display:block;animation:fadein .28s ease-out both}
.rep .lab{font-family:var(--con);font-size:9.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--ip-amber);margin:12px 0 4px}
.rep .lab.g{color:#8FE494}
.rep .you{border-left:2px solid rgba(255,255,255,.25);padding-left:11px;margin-bottom:4px}

.chain{display:flex;gap:0;overflow-x:auto;padding:4px 0 10px}

.chain .st::after{content:'';position:absolute;right:-6px;top:19px;width:12px;height:12px;border-top:2px solid rgba(255,255,255,.22);
  border-right:2px solid rgba(255,255,255,.22);transform:rotate(45deg)}
.chain .st:last-child::after{display:none}

  display:flex;align-items:center;justify-content:center;color:var(--ip-amber);margin-bottom:10px}
.chain .st .tt{font-size:12.8px;font-weight:700;margin-bottom:4px;line-height:1.3}

.sev-m{border-left:3px solid var(--ip-gold)}

.dkql .k-op{color:#7FB3FF}.dkql .k-fn{color:#E8C07D}.dkql .k-str{color:#FF9E9B}.dkql .k-num{color:#8FE494}.dkql .k-tab{color:#FFB27A;font-weight:600}.dkql .k-cmt{color:#8496C4}

@media(max-width:1500px){ .meter{max-width:112px} }

  .c-title{max-width:110px}
  .c-clock{min-width:66px}

}

@media print{
  html,body{overflow:visible;height:auto;background:#fff}
  #app,#console,#facil,#toast,#simband,#simtag,.noprint{display:none!important}
  #screen{position:static;display:block!important;background:#fff!important;background-image:none!important;color:#000}
  .sc{max-width:100%;padding:0;color:#000}
  .sc h1,.sc .dim .nm,.gcard .t,.rep .rq,.ai .t{color:#000}
  .sc .lede,.gcard .d,.rep .rbdy,.ai .d,.dim .ds{color:#333}
  .gcard,.rep,.ai,.owlwrap{background:#fff;border:1px solid #BBB;break-inside:avoid}
  .rep .rbdy{display:block!important}
  .dkql{background:#F4F4F4;border:1px solid #CCC}
  .dkql pre{color:#111}
  .sc h2{color:#000;border-bottom:1px solid #999;padding-bottom:5px}
  .sc h2::after{display:none}
  .ring .v,.dim .sc2,.gcard .n{color:#000}
  .band{border:1px solid #666;color:#000}
}

</div>

const PROFO_IMG='https://storage.ghost.io/c/3c/1d/3c1dd412-3b6a-4afe-8bbc-88099d729abf/content/images/size/w960/2025/08/PROFOHACKER.png';

function profo(s=52){
  return `<img src="${PROFO_IMG}" alt="" width="${s}" height="${s}" loading="lazy"`
   +` style="width:${s}px;height:${s}px;object-fit:contain;flex-shrink:0;display:block"`
   +` onerror="this.style.visibility='hidden'">`;
}

function ipMark(h=16,onDark=true){
  const fs=Math.round(h*1.02);
  return `<span style="display:inline-flex;align-items:center;gap:${Math.round(h*.42)}px;flex-shrink:0;line-height:1">`
   +profo(Math.round(h*1.6))
   +`<span style="font-family:var(--ui);font-size:${fs}px;font-weight:700;letter-spacing:-.35px;white-space:nowrap;`
   +`color:${onDark?'#fff':'var(--ip-navy)'}">IT<span style="color:${onDark?'var(--ip-amber)':'var(--ip-acc)'}"> Professor</span></span></span>`;
}

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sev=(s,lbl=true)=>`<span class="sevsq ${s}"><span class="sq"><i></i><i></i><i></i></span>${lbl?s:''}</span>`;
const stat=s=>`<span class="stat ${s.replace(/\s/g,'')}"><span class="d"></span>${s}</span>`;
const av=(t,bg='#7A7574',sz=22)=>`<span style="width:${sz}px;height:${sz}px;border-radius:50%;background:${bg};color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:${Math.round(sz*.45)}px;font-weight:700;flex-shrink:0">${t}</span>`;
function crumbs(list){return `<div class="crumbs">${list.map((c,i)=>{
  const last=i===list.length-1;
  return (i>0?`<span class="sep">${icon.chevR(12)}</span>`:'')+(last?`<span class="cur">${c}</span>`:`<a>${c}</a>`);}).join('')}</div>`;}

const RAIL=[['burger'],['home'],['bolt'],['search'],['flow'],['shield'],['laptop'],['users'],['mail'],['cloud'],['db'],['chart'],['dots']];
function rail(activeIcon){
  $('leftrail').innerHTML=RAIL.map(([ic])=>`<button class="railbtn ${ic===activeIcon?'active':''}" tabindex="-1" aria-hidden="true">${icon[ic](18)}</button>`).join('');

let toastT=null;
function toast(html,ms=3400){
  const t=$('toast');t.innerHTML=`<span style="color:var(--ip-amber);flex-shrink:0">${icon.info(16)}</span><div>${html}</div>`;
  t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),ms);
}

function kqlHi(src){
  return esc(src)
   .replace(/(\/\/[^\n]*)/g,'<span class="k-cmt">$1</span>')
   .replace(/\b(SigninLogs|AADNonInteractiveUserSignInLogs|AuditLogs|CloudAppEvents|OfficeActivity|EmailEvents|EmailPostDeliveryEvents|IdentityInfo|AlertEvidence|SecurityAlert|UrlClickEvents|IdentityLogonEvents|AADUserRiskEvents)\b/g,'<span class="k-tab">$1</span>')
   .replace(/\b(let|where|project|summarize|extend|join|union|order|sort|by|on|and|or|not|has|in|contains|startswith|endswith|distinct|count|take|top|render|mv-expand|make-set|parse|datatable|between|ago|now|todatetime|bin|arg_max|arg_min|iff|case|isnotempty|isempty|dcount|countif|toscalar|materialize|invoke|lookup|kind|inner|leftouter|anti|asc|desc)\b/g,'<span class="k-op">$1</span>')
   .replace(/(&quot;[^&]*?&quot;|'[^']*?')/g,'<span class="k-str">$1</span>')
   .replace(/\b(\d+[dhm]?)\b/g,'<span class="k-num">$1</span>');
}

         fb:'Correct, and read the order because the order is the lesson. At 07:52 she authenticated for real. A reverse proxy sat between her and the genuine Microsoft sign in page, relayed her password and her Authenticator approval live, and Entra issued a real session to a real successful multifactor sign in. That is why nothing blocked it and why the sign in log shows result code zero. The proxy kept the cookie. From 07:58 the attacker replays it from their own network, so the same session identifier appears from a second autonomous system with an authentication requirement of single factor, because the token already carries the claim. The tell is not a failed sign in. It is a successful one that then travels.'},
        {id:'d',t:'Legitimate access by a colleague sharing the account',d:'Somebody is using her login while she is busy.',
         cost:4,score:{D:1},verdict:'weak',
         fb:'Worth ruling out, and the data rules it out for you. A second person signing in produces a second interactive sign in and a separate session identifier. A shared session identifier means a shared token, and tokens are not shared by accident.'}
      ],
      timeout:{fb:'No assessment was recorded. The incident stayed open and unclassified while the evidence aged.',score:{},cost:6}
    },
    facil:{
      say:['Put the result on screen and read three columns out loud: SessionId, ASN, AuthenticationRequirement. Then read UserAgent.','Do not give the answer. Ask which single row is the phish, and make them justify it.'],
      probe:[
        {q:'Which row is the compromise?',a:'07:52. A successful interactive sign in with multifactor authentication genuinely satisfied, from a hosting provider, on a client she has never used. Everything after it is consequence.'},
        {q:'Why did no control stop the 07:52 sign in?',a:'Because it was a real sign in. She really did enter her password and really did approve the prompt. Conditional access saw a compliant policy satisfied. This is the argument for phishing resistant credentials and for token protection, which binds the token to the device so a replay from another machine fails.'},
        {q:'What would you have alerted on?',a:'One session identifier seen from more than one autonomous system inside a short window, and a user agent change within a single session. Both are cheap and both are high fidelity.'}
      ],
      watch:['Teams often want more evidence here. They have enough. Ask what further query would change the decision, and if nothing would, move.']
    }
  },

  {
    id:'p4',no:4,clock:'09:33',title:'First containment',view:'identity',rail:'users',
    inject:{
      label:'Inject 04 · 09:33',
      title:'You have a confirmed identity compromise and one decision to make',
      body:'The attacker has held the stolen session for ninety six minutes. The action bar on this page gives you Mark as compromised, Confirm safe, Revoke session, Disable and Enable. It does not give you a password reset, because that lives in the Entra admin centre. Whatever you do next, do it in the right order, because the order is the whole point.',
      src:'Source: Microsoft Defender XDR, Identity Inventory action bar'
    },
    decision:{
      q:'What is your first containment action?',
      timer:100,
      opts:[
        {id:'a',t:'Disable',d:'Use the Disable action on this page to block sign in immediately.',
         cost:2,score:{C:2},verdict:'weak',set:{disabledOnly:true},
         fb:'Better than nothing, and not enough, which is exactly what makes it the popular wrong answer. Disabling is a continuous access evaluation critical event, so where the client and the resource both support it, access can be cut within minutes. You cannot rely on that alone. Attacker tooling is usually not a continuous access evaluation capable client, so it holds an ordinary access token that lives until it expires and that Entra ID has no way to call back. Microsoft guidance for emergency revocation is to block sign in and revoke the refresh tokens, not to choose between them. You have also locked out the only person who can tell you what she clicked.'},
        {id:'b',t:'Revoke session',d:'Use the Revoke session action so existing sessions must reauthenticate.',
         cost:2,score:{C:5,E:1},verdict:'part',set:{revoked:true},
         fb:'This is the right first move and an incomplete one. Revocation invalidates the refresh tokens and the browser session cookies together, so the replayed session stops working rather than waiting for a token to expire. What you have not done is stop the attacker signing back in, because you have not changed the credential and you have not confirmed the compromise to Entra ID Protection. Half a containment is a containment the attacker recovers from.'},
        {id:'c',t:'Revoke session here, reset the password in Entra, then Mark as compromised',d:'Three actions across two portals, in that order.',
         cost:4,score:{C:8,E:2},verdict:'strong',set:{revoked:true,reset:true,confirmed:true},
         fb:'Correct, and notice that it takes you out of this portal, which is why it gets skipped. Revoke session first, because revocation invalidates the refresh tokens and the browser session cookies together and does not depend on the attacker using a client that honours continuous access evaluation. Reset the password second, in the Entra admin centre, so the credential is worthless if they hold that too. Mark as compromised third, which raises user risk to high so that risk based conditional access applies to anything that follows. Reversing the first two leaves a window where the old session still works while she is locked out of her own reset.'},
        {id:'d',t:'Watch for another thirty minutes and collect more evidence',d:'Do not tip off the attacker while you build the picture.',
         cost:30,score:{C:0,E:2},verdict:'weak',set:{watched:true},
         fb:'There is a version of this argument that is correct, in a targeted intrusion where you are tracking an operator across an estate and containment would burn your visibility. This is not that. This is a commodity mailbox compromise on a finance account during month end close, and every minute you watch is a minute of access you are choosing to grant. You will see what that bought when the next inject lands.'}
      ],
      timeout:{fb:'No containment was performed. The attacker retained a valid session and continued working.',score:{},cost:14,set:{watched:true}}
    },
    facil:{
      say:['This is the decision the exercise exists for. Slow down and let the room disagree.','If nobody argues, ask the person who chose disable to explain what happens to a refresh token when an account is disabled.'],
      probe:[
        {q:'Does disabling an account kill an existing session?',a:'Sometimes, and not dependably. Disabling is a continuous access evaluation critical event, so a capable client talking to a capable resource is cut within minutes. Anything else keeps its access token until expiry, and an application session cookie is revoked by that application rather than by Entra ID. Revocation is the control that does not depend on the attacker\'s choice of client.'},
        {q:'What is the correct order, and why?',a:'Revoke session, reset the password, mark as compromised. Revoke ends the live session and its cookies. Reset removes the credential. Marking as compromised raises user risk so that risk based conditional access policies apply to any follow up. Disabling as well is sensible. Disabling instead is not.'},
        {q:'Why does this take two portals?',a:'Because the Defender action bar deliberately carries containment actions and not directory administration. Password reset is an Entra operation. Teams that live only in Defender routinely stop after Revoke session and believe they are finished.'},
        {q:'What is your organisation\'s actual runbook order?',a:'Ask for it. If it is not written down, that is the second finding of the day.'}
      ],
      watch:['The watch and learn answer is popular with experienced people. Let them make the case, then ask what they would say to the customer at the debrief if the attacker moved during those thirty minutes.']
    }
  },

  {
    id:'p5',no:5,clock:'09:41',title:'Persistence sweep',view:'huntaudit',rail:'search',
    inject:{
      label:'Inject 05 · 09:41',
      title:'A password reset does not remove everything',
      body:'Assume the credential is now clean. An attacker who has held an authenticated session for ninety minutes has had time to arrange a way back. You checked her audit blade in the Entra admin centre first and it showed the new authenticator registration and little else, because that blade lists events targeting the user, and the artefact you are hunting targets something else. So you are querying the AuditLogs table in advanced hunting, across the last twenty four hours.',
      src:'Source: Microsoft Defender XDR, Advanced hunting, AuditLogs'
    },
    decision:{
      q:'Where do you look for persistence? Choose the single sweep you run first.',
      timer:110,
      opts:[
        {id:'a',t:'Chase the inbox rule and close it out',d:'Remove the RSS Subscriptions rule the alert fired on and call the persistence handled.',
         cost:4,score:{C:2,D:1},verdict:'weak',set:{foundRule:true},
         fb:'You found the artefact the alert already told you about, and you stopped. Two problems. The rule is the noisy persistence, not the durable kind, so removing it changes nothing about whether the attacker can return. And the rule is not in AuditLogs at all. Mailbox rules are written to the unified audit log by Exchange Online, which reaches you as OfficeActivity in Sentinel or CloudAppEvents in advanced hunting. Chasing it in this table costs time and returns nothing.'},
        {id:'b',t:'Authentication method registration and application consent, in AuditLogs',d:'Filter the table for security info registration and for consent to application.',
         cost:6,score:{C:5,D:4,E:2},verdict:'strong',set:{foundRule:true,foundMFA:true,foundOAuth:true},
         fb:'Correct, and both are sitting in front of you. At 08:11:37, User registered security info adds a second Authenticator from 45.132.192.60, which means the attacker can satisfy multifactor authentication from now on whatever you do to the password. At 08:24:59, Consent to application for Mail Reporting Assistant, followed by Add delegated permission grant for Mail.ReadWrite, Mail.Send and offline_access, then Add service principal. That grant is the real persistence: the application holds its own refresh token, and no password reset touches it. Removing it means revoking the grant and deleting the service principal, not just deleting a rule. And notice the consent never appeared on her user blade, because its audit target is the service principal, not her.'},
        {id:'c',t:'Conditional access policy changes',d:'Check whether the attacker weakened a policy while they had access.',
         cost:5,score:{C:2,D:2},verdict:'part',
         fb:'A good instinct, and the right log for it. It did not happen here, and the footer of this view tells you so. Aisha is a finance manager with no directory role, so she could not have changed a policy even if the attacker had tried. Save this sweep for the incidents where the compromised identity is privileged, and ask first whether the account could escalate at all.'},
        {id:'d',t:'Device registration and Entra joined devices',d:'Look for a new device joined to the tenant.',
         cost:5,score:{C:2,D:2},verdict:'part',
         fb:'Correct in principle. Device registration is real persistence and a favourite technique. It did not happen here, and while you were checking, an application consent and a new authenticator registration were both sitting one page away in the same audit log.'}
      ],
      timeout:{fb:'No sweep was run. The persistence remains in place and will still be there when this incident is closed.',score:{},cost:8}
    },
    facil:{
      say:['Ask the room to name every persistence mechanism they can think of in Entra ID and Exchange Online before you show the options.','Write the list on the wall. Compare it to what the attacker actually did.'],
      probe:[
        {q:'Which of these survives a password reset?',a:'All of them. That is the point. A registered authenticator, a consented application, a mail forwarding rule and a joined device all continue to function after the credential changes.'},
        {q:'Who in your organisation can approve an application consent?',a:'If the answer is any user, you have found a control gap worth more than this exercise. User consent for applications should be restricted to verified publishers and low risk permissions, with an admin consent workflow behind it.'},
        {q:'Why did her audit blade in Entra come up almost empty?',a:'The per user blade lists events that target the user. A consent event targets the application and its service principal, with the user as the initiator only, so it never appears there. This is exactly why the sweep is a query against the AuditLogs table, where you filter on initiator and target together.'},
        {q:'How would you have detected the consent grant in the first hour?',a:'AuditLogs, Consent to application, correlated to a user already flagged as risky. It is a standard Sentinel analytic rule and it is very often left disabled because it is noisy in tenants that allow user consent.'},
        {q:'Where does the mailbox rule live?',a:'Not in AuditLogs. Exchange Online writes it to the unified audit log, which lands as OfficeActivity in Sentinel or CloudAppEvents in advanced hunting. Two different audit trails for one incident is normal, and knowing which artefact lands where is half the job.'}
      ],
      watch:['Very few teams name authentication method registration unprompted. It is the highest value gap in this whole exercise.']
    }
  },

  {
    id:'p6',no:6,clock:'09:52',title:'Scope of access',view:'huntfiles',rail:'search',
    inject:{
      label:'Inject 06 · 09:52',
      title:function(s){return s.disabledOnly?'The session is still alive':(s.watched?'The attacker used the time you gave them':'The session is dead, and now you need to know what it reached');},
      body:function(s){
        if(s.disabledOnly) return 'You disabled the account at 09:33. Sign in was blocked and the Exchange session dropped within two minutes. The attacker was not in Outlook. Their client holds an ordinary access token with the balance of an hour left on it, and at 09:44 session 7b31 appeared again against SharePoint Online. Disabling raised the cost and did not close the door. The attacker has now opened 340 files across three Finance libraries, including one called Payments and Bank Details.';
        if(s.watched) return 'While you watched, the attacker opened 340 files across three Finance libraries, including one called Payments and Bank Details, and downloaded 41 of them. The activity stopped on its own at 09:49. You have a complete record of it, which is the one thing your decision bought you.';
        return 'Revocation took effect at 09:35 and session 7b31 stopped working. Before it did, the attacker opened 340 files across three Finance libraries, including one called Payments and Bank Details, and downloaded 41 of them between 08:30 and 09:34.';
      },
      src:'Source: Microsoft Defender XDR, Advanced hunting, CloudAppEvents'
    },
    decision:{
      q:'The customer will ask what was taken. How do you answer that question?',
      timer:120,
      opts:[
        {id:'a',t:'Query CloudAppEvents for every file operation from the attacker address',d:'Build a file level list with timestamps, operation type and site path.',
         cost:9,score:{E:7,D:4},verdict:'strong',set:{scoped:true},
         fb:'Correct, and this is the deliverable that decides whether the customer trusts you afterwards. FileAccessed and FilePreviewed tell you what was opened. FileDownloaded and FileSyncDownloadedFull tell you what left the tenant. Filter on the attacker address rather than on the user, or you will hand her back a report of her own morning mixed with the intrusion. A named list of 41 downloaded files is a position the customer can act on. The phrase possible access to the finance site is not.'},
        {id:'b',t:'Assume worst case and tell them everything in the site is exposed',d:'Be cautious and let the customer decide.',
         cost:2,score:{E:2},verdict:'weak',
         fb:'Caution that creates work is not caution. Declaring an entire SharePoint site exposed forces a data subject notification exercise across thousands of records when the evidence supports forty one files. You have the telemetry to be precise. Choosing not to use it moves your cost onto the customer.'},
        {id:'c',t:'Ask Aisha what was in the folder',d:'She knows the content better than any log does.',
         cost:6,score:{E:2,D:1},verdict:'part',
         fb:'Do this as well, never instead. She can tell you what the files mean, which matters enormously for the personal data question. She cannot tell you which ones the attacker opened. Pair her knowledge of the content with your log of the access, and you have an answer that survives scrutiny.'},
        {id:'d',t:'Check whether any data loss prevention alerts fired',d:'If nothing triggered, nothing sensitive moved.',
         cost:4,score:{E:1},verdict:'weak',
         fb:'Absence of a data loss prevention alert is not evidence of absence. The policies in this tenant cover email and endpoint egress, not authenticated SharePoint downloads by a session that looks like the file owner. Never let a silent control stand in for a query you could have run.'}
      ],
      timeout:{fb:'No scoping was performed. When the customer asks what was taken, you will not have an answer, and the assumption they make will be the worst one.',score:{},cost:10}
    },
    facil:{
      say:['If the room chose disable at inject four, dwell on this screen. This is the consequence, not a punishment.','Ask what the customer will actually ask. It is never what happened. It is what did they get.'],
      probe:[
        {q:'What is the difference between FileAccessed and FileDownloaded here?',a:'Opened in the browser versus pulled to a device. Both matter for a personal data assessment, and they carry different weight. Report them separately and say which is which.'},
        {q:'Where does this data live in your customer tenants?',a:'CloudAppEvents in advanced hunting, OfficeActivity in Sentinel if the Office 365 connector is on. Check the retention on both. Thirty days makes a discovery in week five impossible to scope, and you will be asked to scope it anyway.'}
      ],
      watch:['Watch for the phrase we assume the worst. Ask what that assumption costs the customer in notification effort and in trust.']
    }
  },

  {
    id:'p7',no:7,clock:'10:06',title:'The moment it stops being technical',view:'bridge',rail:'bolt',
    inject:{
      label:'Inject 07 · 10:06',
      title:'The downloaded files contain personal data',
      body:'The 41 downloaded files include a supplier payments workbook and a folder of employee expense claims holding names, home addresses, bank account numbers and sort codes for 96 people. Harbord Marine is the data controller. You are their processor. Nobody at Harbord Marine knows yet.',
      src:'Source: SOC bridge, incident 4472'
    },
    decision:{
      q:'It is 10:06. What do you do about telling people?',
      timer:130,
      opts:[
        {id:'a',t:'Notify the named customer contact now with what you know, and state the regulatory clock',d:'Facts to date, what is confirmed, what is not, and that the seventy two hour obligation is theirs and has started.',
         cost:5,score:{K:9,E:2},verdict:'strong',set:{notified:true},
         fb:'Correct on every axis. You told them early, you separated confirmed from suspected, and you did not make their decision for them. Under the United Kingdom General Data Protection Regulation the controller has seventy two hours from becoming aware to notify the Information Commissioner\'s Office where the breach is likely to present a risk. As processor your duty is to inform the controller without undue delay so their clock starts on a real time and not on the day they happened to read your report.'},
        {id:'b',t:'Finish the investigation, then send one complete report this afternoon',d:'Avoid alarming the customer with an incomplete picture.',
         cost:14,score:{K:2,E:1},verdict:'weak',
         fb:'A complete report at 16:00 is a worse product than a partial one at 10:15. You have taken four to six hours off the customer\'s deliberation time on a seventy two hour obligation, and you have made a disclosure decision on their behalf by delaying it. Customers forgive uncertainty. They do not forgive finding out that you knew at ten.'},
        {id:'c',t:'Notify the Information Commissioner\'s Office yourself',d:'Report the breach directly to the regulator to be safe.',
         cost:8,score:{K:0},verdict:'weak',
         fb:'This is not yours to do. Harbord Marine is the controller and the notification duty sits with them. A processor reporting on a controller\'s behalf without instruction oversteps the contract, and it may commit the customer to a position their own legal advice would not have taken. Tell them, advise them, document that you advised them.'},
        {id:'d',t:'Send a short holding message and promise detail within the hour',d:'Flag that something is happening without the specifics.',
         cost:3,score:{K:4,E:1},verdict:'part',set:{notified:true},
         fb:'Better than silence and worse than substance. A message that says we are investigating an incident and will update you gives the customer anxiety without information. If you are going to interrupt their morning, arrive with the three things they need: what is confirmed, what you have already done, and what they need to decide.'}
      ],
      timeout:{fb:'The customer was not told. The morning went on, and their seventy two hour clock started later than it should have, on your delay.',score:{},cost:12}
    },
    facil:{
      say:['This is the point where the room composition matters. If legal or a service delivery manager is present, hand them the floor.','Read the option about notifying the regulator yourself aloud even if nobody picks it. It comes up in real incidents.'],
      probe:[
        {q:'Who is the controller and who is the processor here?',a:'Harbord Marine controls the personal data. Your managed service is a processor. The notification duty is the controller\'s, and your duty is to inform them without undue delay.'},
        {q:'When did the seventy two hours start?',a:'On the controller becoming aware. Which is why the timing of your call is a legal fact, not a courtesy.'},
        {q:'Do you have a named out of hours contact for every customer?',a:'Ask for the list. If it is a shared mailbox that is monitored in office hours, this incident at 22:00 on a Friday goes very differently.'}
      ],
      watch:['Teams under pressure default to finishing the work before speaking. Name the instinct and challenge it.']
    }
  },

  {
    id:'p8',no:8,clock:'10:19',title:'The mailbox is still sending',view:'email',rail:'mail',
    inject:{
      label:'Inject 08 · 10:19',
      title:'Fourteen internal messages went out from her mailbox at 09:12',
      body:'Before you contained anything, the attacker sent fourteen messages from Aisha\'s own mailbox to colleagues in finance and procurement. The subject is Updated remittance details for Q3, the attachment is a PDF, and every message is genuinely from her account, so it passed authentication, arrived without a warning banner and sits in her Sent Items. Nine have been read.',
      src:'Source: Defender for Office 365, Threat Explorer'
    },
    decision:{
      q:'How do you deal with the fourteen messages?',
      timer:110,
      opts:[
        {id:'a',t:'Soft delete all fourteen with a remediation action, then warn the recipients by telephone',d:'Purge from every mailbox, then reach the nine readers out of band.',
         cost:7,score:{C:7,K:3},verdict:'strong',set:{purged:true},
         fb:'Correct on both halves. Soft delete rather than hard delete keeps the messages recoverable, which matters if the customer later needs them for their own investigation or for a claim. The out of band warning matters more than people expect: nine colleagues have already read a convincing internal email, and telling them by email that internal email cannot be trusted is a circular instruction. Telephone, or walk to the desk.'},
        {id:'b',t:'Hard delete all fourteen immediately',d:'Purge them permanently so nobody can act on them.',
         cost:5,score:{C:4},verdict:'part',
         fb:'The containment is right and the method destroys your evidence. A hard delete is not recoverable, and you have just removed fourteen items that a customer under a notification obligation may need to produce. Soft delete achieves the same protection and keeps the artefacts.'},
        {id:'c',t:'Email everyone in finance warning them not to trust the message',d:'Broadcast a warning to the affected department.',
         cost:4,score:{C:1,K:2},verdict:'weak',
         fb:'The messages are still sitting in fourteen inboxes while you compose. A warning without a removal leaves the payload in place and relies on every recipient reading your email before they read hers. Remove first, then warn, and warn by a channel that is not the one under attack.'},
        {id:'d',t:'Block the sender address at the mail gateway',d:'Stop any further messages from that address.',
         cost:3,score:{C:0},verdict:'weak',
         fb:'The sender is your own customer\'s finance manager and the messages are internal, so they never touched a gateway. Blocking her address prevents her from working and does nothing to the fourteen messages already delivered. This is a control aimed at an external threat applied to an internal one.'}
      ],
      timeout:{fb:'The messages stayed in fourteen inboxes. Two more colleagues opened the attachment while the decision was pending.',score:{},cost:9}
    },
    facil:{
      say:['Show the message. Let the room read it as a recipient would, with her real name and her real signature block.','Ask who in the room would have spotted it.'],
      probe:[
        {q:'Why does this message pass every authentication check?',a:'Because it is genuine. It came from the real mailbox through the real tenant. Sender Policy Framework, DomainKeys Identified Mail and Domain based Message Authentication all pass, because none of them assert that the human being was the one typing.'},
        {q:'Soft delete or hard delete?',a:'Soft, unless the customer instructs otherwise. Recoverability is worth more than the marginal risk, and destroying evidence during a notifiable breach is difficult to defend afterwards.'}
      ],
      watch:['Somebody usually suggests warning by email. Let it stand for a moment, then ask what channel the attacker controls.']
    }
  },

  {
    id:'p9',no:9,clock:'10:34',title:'The call',view:'call',rail:'bolt',
    inject:{
      label:'Inject 09 · 10:34',
      title:function(s){return s.notified?'The finance director calls back':'The finance director calls, and has not been told anything yet';},
      body:function(s){
        const pre=s.notified?'Fifteen minutes after your notification, ':'They have found out on their own. ';
        return pre+'the finance director of Harbord Marine is on the line. Yesterday afternoon a payment of forty eight thousand pounds was approved to a supplier whose bank details had been updated by email. The email came from Aisha. The supplier is real, the invoice is real, and the account number is not theirs. The payment left the account at 17:40 yesterday.';
      },
      src:'Source: Telephone, Harbord Marine finance director'
    },
    decision:{
      q:'You have the finance director on the line right now. What is the first thing you tell them to do?',
      timer:100,
      opts:[
        {id:'a',t:'Call the bank now and request an indemnity recall on the payment',d:'Before anything else, before any further investigation.',
         cost:2,score:{K:8,C:5},verdict:'strong',set:{recall:true},
         fb:'Correct, and it is the only answer where the ordering is not a preference. Funds recovery is a race measured in hours. The bank can attempt a recall while the money is still sitting in the receiving account, and after that it is gone through a mule network. Also tell them to report to Action Fraud, and to preserve the email thread rather than deleting it. Your investigation continues while the bank works. Nothing you learn in the next hour recovers the money, and the phone call might.'},
        {id:'b',t:'Explain the incident fully first so they understand the context',d:'Give them the technical picture before advising action.',
         cost:9,score:{K:3},verdict:'part',
         fb:'You are right that they need the picture, and you have chosen the wrong nine minutes to give it. Say one sentence, call your bank now and ask for an indemnity recall on yesterday\'s payment, and then explain everything. Context keeps. Recall windows do not.'},
        {id:'c',t:'Tell them to report it to the police and await guidance',d:'Treat it as a fraud matter for law enforcement.',
         cost:5,score:{K:2},verdict:'weak',
         fb:'Reporting to Action Fraud is correct and it belongs second. Law enforcement will not recover this money, and waiting for guidance costs the only window where recovery is possible. Bank first, report second, investigate throughout.'},
        {id:'d',t:'Tell them you cannot advise on financial matters and stay on technical ground',d:'Stick to the scope of the security service.',
         cost:4,score:{K:0},verdict:'weak',
         fb:'You are not giving financial advice. You are telling a customer, in the middle of a fraud you are handling, that a payment made under a forged instruction can sometimes be recalled if the bank is told immediately. Retreating behind scope in this moment is the thing customers remember about a provider, and not warmly.'}
      ],
      timeout:{fb:'The call ended without direction. The recall was requested the following morning, by which point the receiving account had been emptied.',score:{},cost:11}
    },
    facil:{
      say:['Deliver this one as a phone call. Read it aloud in character and do not put it on screen until they have answered.','Keep the timer short. The pressure is the exercise.'],
      probe:[
        {q:'Does your team know what to tell a customer about payment recall?',a:'Most technical teams do not, and it is a single sentence that occasionally recovers tens of thousands of pounds. Put it in the business email compromise runbook.'},
        {q:'Where did the payment change actually come from?',a:'The mailbox, yesterday. Which means the compromise is older than this morning\'s alert. Ask the room what that does to their scoping.'}
      ],
      watch:['This inject reveals whether the team can switch from analyst mode to advisor mode. It is the skill that separates a good managed service from a ticket queue.']
    }
  },

  {
    id:'p10',no:10,clock:'10:47',title:'Closing the incident',view:'close',rail:'bolt',
    inject:{
      label:'Inject 10 · 10:47',
      title:'How you close this decides what your reporting says for the next twelve months',
      body:'Containment is done, persistence is removed, the customer is engaged and the bank has been called. The incident is still open in Defender XDR with classification and determination unset. Whatever you choose here feeds the customer\'s monthly report, your own detection tuning and Microsoft\'s learning.',
      src:'Source: Microsoft Defender XDR, Manage incident'
    },
    decision:{
      q:'How do you classify and close incident 4472?',
      timer:110,
      opts:[
        {id:'a',t:'True positive, compromised account, with a written summary and the file list attached',d:'Set both fields, write the narrative, link the evidence.',
         cost:6,score:{E:10,D:4,K:5},verdict:'strong',set:{closedWell:true},
         fb:'Correct. The determination field is the one that matters and the one most often left blank. Compromised account is precise: it tells your future self, the customer and the product what actually happened, as distinct from phishing, which describes the delivery. The written summary is what your colleague reads at 02:00 when the same technique lands in another tenant, and it is what the customer\'s legal advisers read when they assess the notification.'},
        {id:'b',t:'True positive, phishing',d:'The root cause was a phishing email, so classify it as phishing.',
         cost:3,score:{E:4,D:2,K:1},verdict:'part',
         fb:'Defensible and imprecise. Phishing describes how they got in. What happened is that an account was compromised, persistence was established and funds were taken. Determination drives your reporting categories, so a year of these gets you a chart that says you have a phishing problem when what you have is a token theft and consent problem.'},
        {id:'c',t:'True positive, no determination, close it',d:'The classification is the part that matters.',
         cost:2,score:{E:1},verdict:'weak',

  ],

  chain:[
    {ic:'mail',t:'Phishing link',d:'A message from a compromised supplier carries a link to a reverse proxy that renders the real Microsoft sign in page.',mi:'T1566.002'},
    {ic:'globe',t:'Adversary in the middle',d:'Credentials and the Authenticator approval are relayed live to the real sign in page. Entra records a successful multifactor sign in. The proxy keeps the cookie.',mi:'T1557'},
    {ic:'key',t:'Token replay',d:'The cookie is replayed from a second network six minutes later. Same session identifier, different autonomous system, different user agent, single factor requirement.',mi:'T1550.001'},
    {ic:'lock',t:'Method registration',d:'A new authenticator app is registered, so the attacker can satisfy multifactor authentication from now on.',mi:'T1098.005'},
    {ic:'robot',t:'Consent grant',d:'An application receives delegated Mail.ReadWrite, Mail.Send and offline_access, and holds its own refresh token.',mi:'T1098.003'},
    {ic:'forward',t:'Inbox rule',d:'Replies are moved to RSS Subscriptions so the real owner never sees the thread.',mi:'T1564.008'},
    {ic:'file',t:'Collection',d:'340 files opened in the finance site, 41 downloaded, including payment and bank detail records.',mi:'T1114.002'},
    {ic:'scale',t:'Payment fraud',d:'Bank details are changed by email from a genuine internal mailbox. Forty eight thousand pounds leaves the account.',mi:'T1534'}
  ],

  detections:[
    {t:'One session identifier, two autonomous systems',
     d:'The highest fidelity signal in this incident, and it needs both sign in tables, because the phished sign in is interactive and the replay that follows is not. ResultType is a string column and the autonomous system number type drifts between the two tables, so both are normalised inside each branch before the union. In a healthy tenant this returns zero rows, which is the detection working rather than the query failing: comment out the final where clause to see the baseline sessions it evaluated.',
     q:`let LookBack = 24h;
let DetectionWindow = 1h;
let SignIns = materialize(
    union isfuzzy=true
        (SigninLogs
        | where TimeGenerated >= ago(LookBack)
        | project TimeGenerated, IngestedAt = ingestion_time(),
                  LogType = "Interactive", SessionId, UserPrincipalName,
                  IPAddress, Location, UserAgent,
                  ASN = tostring(AutonomousSystemNumber),
                  ResultType = tostring(ResultType)),
        (AADNonInteractiveUserSignInLogs
        | where TimeGenerated >= ago(LookBack)
        | project TimeGenerated, IngestedAt = ingestion_time(),
                  LogType = "NonInteractive", SessionId, UserPrincipalName,
                  IPAddress, Location, UserAgent,
                  ASN = tostring(AutonomousSystemNumber),
                  ResultType = tostring(ResultType))
    | where ResultType == "0"
    | where isnotempty(SessionId));
let Seed =
    SignIns
    | where IngestedAt >= ago(DetectionWindow)
    | distinct SessionId;
SignIns
| where SessionId in (Seed)
| summarize ASNs      = make_set_if(ASN, isnotempty(ASN), 20),
            IPs       = make_set(IPAddress, 20),
            Countries = make_set_if(Location, isnotempty(Location), 20),
            Agents    = make_set_if(UserAgent, isnotempty(UserAgent), 20),
            LogTypes  = make_set(LogType, 2),
            FirstSeen = min(TimeGenerated),
            LastSeen  = max(TimeGenerated),
            Events    = count()
        by SessionId, UserPrincipalName
| where array_length(ASNs) > 1
| extend RiskIndicators = strcat("MultiASN",
      iff(array_length(Agents) > 1, " AgentChange", ""),
      iff(array_length(Countries) > 1, " MultiCountry", ""),
      iff(array_length(LogTypes) > 1, " CrossLogType", ""))
| order by LastSeen desc`},
    {t:'Authentication method registered by a risky user',
     d:'Registration of a new multifactor method is normal. Registration by an account Entra ID Protection already considers risky is not. This is the rule that catches the 08:11 registration while it is still just persistence.',
     q:`let LookBack = 24h;
AuditLogs
| where TimeGenerated >= ago(LookBack)
| where OperationName in ("User registered security info",
                          "User registered all required security info",
                          "Admin registered security info")
| where Result == "success"
| extend Actor   = tostring(InitiatedBy.user.userPrincipalName),
         ActorIp = tostring(InitiatedBy.user.ipAddress),
         Method  = tostring(TargetResources[0].displayName)
| join kind=inner (
    AADUserRiskEvents
    | where TimeGenerated >= ago(7d)
    | where RiskLevel in ("high", "medium")
    | project RiskUser = UserPrincipalName, RiskTime = TimeGenerated,
              RiskEventType, RiskLevel
    ) on $left.Actor == $right.RiskUser
| where RiskTime between ((TimeGenerated - 6h) .. TimeGenerated)
| project TimeGenerated, Actor, ActorIp, Method, RiskEventType, RiskLevel`},
    {t:'Delegated consent to an application with mail permissions',
     d:'The scopes live inside modifiedProperties, under ConsentAction.Permissions for the consent event and DelegatedPermissionGrant.Scope for the grant. Worth knowing: this event never appears on the per user audit blade in Entra, because its audit target is the service principal and the user is only the initiator. Query the table.',
     q:`let LookBack = 24h;
AuditLogs
| where TimeGenerated >= ago(LookBack)
| where OperationName in ("Consent to application",
                          "Add delegated permission grant")
| where Result == "success"
| mv-expand ModifiedProperty = TargetResources[0].modifiedProperties
| where tostring(ModifiedProperty.displayName) in
        ("ConsentAction.Permissions", "DelegatedPermissionGrant.Scope")
| extend Permissions = tostring(ModifiedProperty.newValue)
| extend Actor = coalesce(tostring(InitiatedBy.user.userPrincipalName),
                          tostring(InitiatedBy.app.displayName)),
         ActorIp = tostring(InitiatedBy.user.ipAddress),
         AppName = tostring(TargetResources[0].displayName)
// Comment the next line out to audit every consent, whatever the scope.
| where Permissions has_any ("Mail.ReadWrite", "Mail.Send", "Mail.Read",
                             "MailboxSettings")
| project TimeGenerated, OperationName, Actor, ActorIp, AppName, Permissions`},
    {t:'Inbox rule that hides mail',
     d:'Worth saying plainly, because it catches people out: mailbox rules are not in AuditLogs at all. Exchange Online writes them to the unified audit log, which reaches you as OfficeActivity in Sentinel or CloudAppEvents in advanced hunting.',
     q:`let LookBack = 24h;
OfficeActivity
| where TimeGenerated >= ago(LookBack)
| where OfficeWorkload == "Exchange"
| where Operation in ("New-InboxRule", "Set-InboxRule")
| extend Params = tostring(Parameters)
| where Params has_any ("RSS Subscriptions", "RSS Feeds",
                        "Conversation History", "Archive", "Junk")
      or Params has "MarkAsRead"
| where Params has_any ("Delete", "MoveToFolder", "ForwardTo", "RedirectTo")
| project TimeGenerated, UserId, Operation, ClientIP, Params`},
    {t:'Bulk file access followed by download in a finance site',
     d:'Aim this at the libraries that matter rather than at the tenant. The identity comes from RawEventData.UserId, which carries the user principal name, because AccountId in CloudAppEvents is an object identifier and never matches a UPN. Timestamp is the advanced hunting column; swap it for TimeGenerated in Sentinel.',
     q:`let LookBack = 24h;
let Threshold = 50;
CloudAppEvents
| where Timestamp >= ago(LookBack)
| where ActionType in ("FileAccessed", "FileDownloaded",
                       "FileSyncDownloadedFull")
| extend Site   = tostring(RawEventData.SiteUrl),
         File   = tostring(RawEventData.SourceFileName),
         UserId = tostring(RawEventData.UserId)
| where Site has "/sites/Finance"
| summarize Files = dcount(File),
            Downloads = countif(ActionType != "FileAccessed"),
            FileList = make_set(File, 100)
        by UserId, IPAddress, bin(Timestamp, 1h)
| where Files > Threshold`}
  ],

  actions:[
    {sev:'h',t:'Require phishing resistant authentication for finance and privileged roles',
     d:'Adversary in the middle defeats every multifactor method that can be relayed, including the push this user approved. It does not defeat a passkey or a certificate, because the credential is bound to the origin. Start with the roles that move money.',
     own:'Identity owner · 30 days'},
    {sev:'h',t:'Turn on token protection in conditional access for Exchange and SharePoint',
     d:'Token protection binds the session token to the device it was issued to, so a token replayed from another machine fails. It is the control that would have stopped the 07:58 replay outright, and it is very often left off.',
     own:'Identity owner · 30 days'},
    {sev:'h',t:'Restrict user consent to applications',
     d:'Set user consent to verified publishers and low risk permissions only, and turn on the admin consent request workflow. This single setting removes the persistence mechanism that survives every password reset.',
     own:'Identity owner · 14 days'},
    {sev:'h',t:'Confirm the non interactive sign in log is ingested for every tenant',
     d:'If it is not on, this incident is invisible. Check it per tenant rather than assuming it, and price the volume before someone switches it off again for cost reasons.',
     own:'SOC engineering · 7 days'},
    {sev:'m',t:'Write the identity containment order into the runbook',
     d:'Revoke sessions, reset the credential, confirm the user as compromised, and block sign in as well rather than instead. Written down, in that order, with the reason next to each step so that nobody reorders it under pressure and nobody assumes continuous access evaluation will do the work for them.',
     own:'SOC lead · 14 days'},
    {sev:'m',t:'Add payment recall to the business email compromise runbook',
     d:'One sentence for the analyst to say on the phone: call your bank now and request an indemnity recall. It is the only step in the whole incident that recovers money, and it expires within hours.',
     own:'Service delivery · 7 days'},
    {sev:'m',t:'Hold a named out of hours contact for every customer',
     d:'A monitored shared mailbox is not a contact. This incident at 22:00 on a Friday needs a person and a telephone number, held somewhere the on call analyst can reach in under a minute.',
     own:'Service delivery · 30 days'},
    {sev:'l',t:'Make determination a required field before an incident is closed',
     d:'Classification without determination produces reporting that counts incidents and explains nothing. Enforce it in the process, then measure the completion rate monthly.',
     own:'SOC lead · 30 days'}
  ],

  lessons:[
    {t:'Severity is the vendor\'s opinion. Priority is yours.',
     d:'A quarantined file that never executed outranked a live identity compromise for as long as the queue was sorted by severity. Two Medium alerts on one identity are one High incident, and no product will make that correlation for you as reliably as an analyst who reads the names.'},
    {t:'The compromise was a successful sign in, not a failed one.',
     d:'The 07:52 event is a real interactive sign in with multifactor authentication genuinely satisfied, result code zero, from a client she had never used. Nothing blocked it because there was nothing wrong with it. Teams that hunt for failures and anomalous denials will never see this. What gives it away is that the session it created then appears from a second network on a different user agent, and that only becomes visible when you read the interactive and non interactive logs together.'},
    {t:'Disabling an account is not containment on its own.',
     d:'Disabling is a continuous access evaluation critical event, so it cuts capable clients quickly. Attacker tooling is rarely a capable client, and it keeps an ordinary access token until that token expires. Revoke the sessions first, because revocation invalidates refresh tokens and session cookies together and does not depend on what the attacker chose to connect with. Then reset, then confirm compromised. Teams that get this wrong believe they have contained an incident that is still running.'},
    {t:'The persistence is the part that survives your password reset, and it is in a different log.',
     d:'A registered authenticator and a consented application both outlive the credential, and both are written to the Entra audit log. The mailbox rule that the alert fired on is not there at all, because Exchange writes it to the unified audit log. One incident, two audit trails. Knowing which artefact lands where is the difference between a sweep that finds the persistence and one that finds the decoy.'},
    {t:'What was taken is a legal question with a technical answer.',
     d:'A named list of forty one files is a position a customer can act on. Possible access to the finance site forces them to assume everything. You had the telemetry to be precise, and precision is the deliverable.'},
    {t:'The hardest decision in the incident involved no technology at all.',
     d:'Telling the customer at 10:06 rather than 16:00, and telling them to call their bank before you finished explaining, were the two choices that changed the outcome for the business. Technical excellence that arrives after the recall window has closed is a report, not a service.'}
  ]
};

VIEWS.hunt=()=>{
const q=`// Both sign in tables, correlated on the session identifier.
// SigninLogs holds interactive sign ins only. Everything an application
// does on the user's behalf lands in the non interactive table, so one
// table alone tells half the story. ResultType is a string column and
// the ASN type drifts between the tables, so both branches are
// normalised before the union.
let LookBack = 24h;
let U = "${S.victimUpn}";
union isfuzzy=true
    (SigninLogs
    | where TimeGenerated >= ago(LookBack)
    | where UserPrincipalName =~ U
    | project TimeGenerated, LogType = "Interactive", SessionId,
              IPAddress, Location, ASN = tostring(AutonomousSystemNumber),
              AuthenticationRequirement, UserAgent, AppDisplayName,
              ResultType = tostring(ResultType)),
    (AADNonInteractiveUserSignInLogs
    | where TimeGenerated >= ago(LookBack)
    | where UserPrincipalName =~ U
    | project TimeGenerated, LogType = "Non-interactive", SessionId,
              IPAddress, Location, ASN = tostring(AutonomousSystemNumber),
              AuthenticationRequirement, UserAgent, AppDisplayName,
              ResultType = tostring(ResultType))
| where ResultType == "0"
| order by TimeGenerated asc`;

VIEWS.huntfiles=()=>{
const q=`// What the stolen session actually reached. The identity comes from
// RawEventData.UserId, which carries the user principal name; AccountId
// in CloudAppEvents is an object identifier and never matches a UPN.
// Filter on the attacker address rather than on the user, or you will
// report her own morning back to her.
let AttackerIp = "45.132.192.60";
let U = "${S.victimUpn}";
CloudAppEvents
| where Timestamp between (datetime(2026-08-16 07:52) .. now())
| where ActionType in ("FileAccessed", "FileDownloaded",
                       "FileSyncDownloadedFull", "FilePreviewed")
| extend Site   = tostring(RawEventData.SiteUrl),
         File   = tostring(RawEventData.SourceFileName),
         UserId = tostring(RawEventData.UserId)
| where UserId =~ U and IPAddress == AttackerIp
| summarize Opened   = countif(ActionType in ("FileAccessed", "FilePreviewed")),
            TakenOut = countif(ActionType in ("FileDownloaded", "FileSyncDownloadedFull")),
            Files    = make_set(File, 200)
        by Site
| order by TakenOut desc`;
return `
${crumbs(['Home','Hunting','Advanced hunting'])}

VIEWS.huntaudit=()=>{
const q=`// Persistence sweep for one identity. Note what is NOT here: the inbox
// rule. Exchange writes mailbox rules to the unified audit log, which
// reaches you as OfficeActivity or CloudAppEvents, never as AuditLogs.
let U = "${S.victimUpn}";
AuditLogs
| where TimeGenerated >= ago(24h)
| where OperationName in ("User registered security info",
                          "Consent to application",
                          "Add delegated permission grant",
                          "Add service principal",
                          "Update conditional access policy",
                          "Register device")
| extend Actor = coalesce(tostring(InitiatedBy.user.userPrincipalName),
                          tostring(InitiatedBy.app.displayName)),
         ActorIp = tostring(InitiatedBy.user.ipAddress),
         Target  = tostring(TargetResources[0].displayName)
| where Actor =~ U or Target =~ U
| project TimeGenerated, OperationName, Actor, ActorIp, Target
| order by TimeGenerated asc`;
return `
${crumbs(['Home','Hunting','Advanced hunting'])}
